→<\/a><\/div>\n  <\/article>\n<\/main>\n<footer class=\"foot\">\n  <div class=\"sign\">\n    <img class=\"seal-oval\" src=\"img/sceau.jpg\" alt=\"Sceau de l'école, Marc Colbert PIERRE, école de vidéographie\">\n    <div class=\"sigbox\"><img src=\"img/signature.png\" alt=\"Signature de Wadley PIERRE\"><b>WADLEY PIERRE<\/b><span>Directeur<\/span><\/div>\n  <\/div>\n  <p>Marc Colbert PIERRE · École de vidéographie — Initiation à la vidéographie · 60 heures<\/p>\n<\/footer>\n<!--@2@-->\n<!--@3@-->\n<!--@0@--><\/body>\n<\/html>\n","ethique-ressources":"<!doctype html>\n<html lang=\"fr\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Éthique et ressources<\/title>\n<meta name=\"claude:viewport-fit-sides\" content=\"cover\">\n<!--@1@-->\n<\/head>\n<body>\n<header class=\"top\">\n  <a class=\"brand\" href=\"index.html\"><img src=\"img/logo.png\" alt=\"Logo de l'établissement Marc Colbert PIERRE, école de vidéographie\"><span><b>Marc Colbert PIERRE<\/b><small>École de vidéographie<\/small><\/span><\/a>\n  <span id=\"access-chip\"><\/span>\n  <button class=\"burger\" aria-label=\"Menu\" onclick=\"document.body.classList.toggle('open')\">☰<\/button>\n  <nav><a href=\"index.html\">Accueil<\/a><a href=\"objectifs.html\">Objectifs<\/a><a href=\"seances-1-4.html\">Séances 1 à 4<\/a><a href=\"seances-5-8.html\">Séances 5 à 8<\/a><a href=\"seances-9-12.html\">Séances 9 à 12<\/a><a href=\"dictionnaire.html\">Dictionnaire<\/a><a href=\"quiz.html\">Quiz<\/a><a href=\"tutoriels.html\">Tutoriels YouTube<\/a><a href=\"evaluation.html\">Évaluation<\/a><a href=\"ethique-ressources.html\" class=on>Éthique et ressources<\/a><a href=\"certification.html\">Certification<\/a><\/nav>\n<\/header>\n<section class=\"banner\"><img src=\"img/miniature.jpg\" alt=\"Marc Colbert PIERRE, école de vidéographie : prise de vue, montage, édition, créativité\" width=\"1672\" height=\"941\"><\/section>\n<section class=\"pensee\" data-mode=\"tous\" aria-label=\"Pensées de motivation et d'inspiration\">\n  <div class=\"pensee-in\">\n    <p class=\"pensee-k\">Pensées<\/p>\n    <div class=\"pensee-tabs\" role=\"tablist\" aria-label=\"Choisir le thème des pensées\">\n      <button type=\"button\" class=\"tab\" role=\"tab\" data-cat=\"motiv\" aria-selected=\"true\">Motivation<\/button>\n      <button type=\"button\" class=\"tab\" role=\"tab\" data-cat=\"montage\" aria-selected=\"false\">Montage<\/button>\n    <\/div>\n    <div class=\"pensee-card\" id=\"pn-card\" role=\"button\" tabindex=\"0\" aria-label=\"Tourner la carte pour voir une autre pensée\">\n      <p id=\"pn-text\" class=\"pensee-t\" aria-live=\"polite\">Chargement de la pensée…<\/p>\n    <\/div>\n    <div class=\"pensee-ctl\">\n      <button type=\"button\" class=\"chip\" id=\"pn-prev\">← Précédente<\/button>\n      <button type=\"button\" class=\"chip\" id=\"pn-rand\">Au hasard<\/button>\n      <button type=\"button\" class=\"chip\" id=\"pn-next\">Suivante →<\/button>\n    <\/div>\n  <\/div>\n<\/section>\n<main class=\"wrap\">\n  <aside class=\"photo\"><img src=\"img/photo-2.jpg\" alt=\"Wadley PIERRE, directeur de l'école\" width=\"600\" loading=\"eager\"><\/aside>\n  <article>\n\n<h1>Éthique, ressources et résultats attendus<\/h1>\n<h2>X. Éthique, sécurité et bonnes pratiques<\/h2>\n<p>Tout au long du parcours, les apprenants devront appliquer les règles suivantes :<\/p>\n<ol><li>Demander l'autorisation des personnes avant de les filmer lorsque cela est nécessaire et respecter leur consentement.<\/li><li>Ne pas diffuser des images privées ou sensibles sans autorisation appropriée.<\/li><li>Utiliser des musiques, images et éléments graphiques dont l'utilisation est autorisée.<\/li><li>Vérifier les informations présentées dans les reportages et éviter les montages qui déforment le sens des propos.<\/li><li>Respecter les consignes de sécurité lors des tournages en extérieur.<\/li><li>Sauvegarder régulièrement les fichiers et organiser les dossiers de production.<\/li><li>Préserver la dignité des personnes filmées, particulièrement lorsqu'il s'agit de mineurs ou de personnes vulnérables.<\/li><\/ol>\n\n<h2>XI. Bibliographie et ressources documentaires<\/h2>\n<h3>Ouvrages de référence<\/h3>\n<ol><li>Brown, B. (2016). <i>Cinematography: Theory and Practice: Image Making for Cinematographers and Directors<\/i> (3e éd.). Routledge.<\/li><li>Bowen, C. J., &amp; Thompson, R. (2018). <i>Grammar of the Shot<\/i> (4e éd.). Routledge.<\/li><li>Millerson, G., &amp; Owens, J. (2012). <i>Video Production Handbook<\/i> (5e éd.). Focal Press.<\/li><\/ol>\n<h3>Ressources techniques en ligne<\/h3>\n<ul><li>Blackmagic Design — <a href=\"https://www.blackmagicdesign.com/products/davinciresolve/training\" target=\"_blank\" rel=\"noopener\">Tutoriels de formation DaVinci Resolve<\/a>.<\/li><li>Shotcut — <a href=\"https://shotcut.org/\" target=\"_blank\" rel=\"noopener\">Site officiel et ressources de Shotcut<\/a>.<\/li><li>YouTube Creators — <a href=\"https://www.youtube.com/creators/\" target=\"_blank\" rel=\"noopener\">Ressources pour les créateurs vidéo<\/a>.<\/li><\/ul>\n<p>Ces ressources peuvent servir de supports complémentaires pour préparer les démonstrations et les exercices. Les versions des logiciels et leurs fonctionnalités devront être vérifiées au moment de la formation.<\/p>\n\n<h2>XII. Résultats attendus au terme des 60 heures<\/h2>\n<p>À l'issue de la formation, chaque apprenant devrait pouvoir :<\/p>\n<ul><li>préparer un projet audiovisuel simple ;<\/li><li>filmer avec un smartphone en maîtrisant les principales règles de prise de vue ;<\/li><li>enregistrer une interview ou une séquence explicative ;<\/li><li>monter ses images sur ordinateur ;<\/li><li>ajouter des éléments sonores et graphiques adaptés ;<\/li><li>exporter une vidéo prête à être visionnée ou diffusée ;<\/li><li>présenter sa démarche de production et justifier ses choix techniques.<\/li><\/ul>\n<blockquote><b>Conclusion pédagogique :<\/b> ce programme de 60 heures constitue une base de formation structurée pour les débutants. Son orientation pratique permet aux apprenants de progresser progressivement, de produire des réalisations concrètes et de développer des compétences réutilisables dans la communication, l'éducation, le journalisme et la création de contenu.<\/blockquote>\n\n    <div class=\"pager\"><a href=\"evaluation.html\">← Évaluation<\/a><a href=\"certification.html\">Certification →<\/a><\/div>\n  <\/article>\n<\/main>\n<footer class=\"foot\">\n  <div class=\"sign\">\n    <img class=\"seal-oval\" src=\"img/sceau.jpg\" alt=\"Sceau de l'école, Marc Colbert PIERRE, école de vidéographie\">\n    <div class=\"sigbox\"><img src=\"img/signature.png\" alt=\"Signature de Wadley PIERRE\"><b>WADLEY PIERRE<\/b><span>Directeur<\/span><\/div>\n  <\/div>\n  <p>Marc Colbert PIERRE · École de vidéographie — Initiation à la vidéographie · 60 heures<\/p>\n<\/footer>\n<!--@2@-->\n<!--@3@-->\n<!--@0@--><\/body>\n<\/html>\n","evaluation":"<!doctype html>\n<html lang=\"fr\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Évaluation<\/title>\n<meta name=\"claude:viewport-fit-sides\" content=\"cover\">\n<!--@1@-->\n<\/head>\n<body>\n<header class=\"top\">\n  <a class=\"brand\" href=\"index.html\"><img src=\"img/logo.png\" alt=\"Logo de l'établissement Marc Colbert PIERRE, école de vidéographie\"><span><b>Marc Colbert PIERRE<\/b><small>École de vidéographie<\/small><\/span><\/a>\n  <span id=\"access-chip\"><\/span>\n  <button class=\"burger\" aria-label=\"Menu\" onclick=\"document.body.classList.toggle('open')\">☰<\/button>\n  <nav><a href=\"index.html\">Accueil<\/a><a href=\"objectifs.html\">Objectifs<\/a><a href=\"seances-1-4.html\">Séances 1 à 4<\/a><a href=\"seances-5-8.html\">Séances 5 à 8<\/a><a href=\"seances-9-12.html\">Séances 9 à 12<\/a><a href=\"dictionnaire.html\">Dictionnaire<\/a><a href=\"quiz.html\">Quiz<\/a><a href=\"tutoriels.html\">Tutoriels YouTube<\/a><a href=\"evaluation.html\" class=on>Évaluation<\/a><a href=\"ethique-ressources.html\">Éthique et ressources<\/a><a href=\"certification.html\">Certification<\/a><\/nav>\n<\/header>\n<section class=\"banner\"><img src=\"img/miniature.jpg\" alt=\"Marc Colbert PIERRE, école de vidéographie : prise de vue, montage, édition, créativité\" width=\"1672\" height=\"941\"><\/section>\n<section class=\"pensee\" data-mode=\"tous\" aria-label=\"Pensées de motivation et d'inspiration\">\n  <div class=\"pensee-in\">\n    <p class=\"pensee-k\">Pensées<\/p>\n    <div class=\"pensee-tabs\" role=\"tablist\" aria-label=\"Choisir le thème des pensées\">\n      <button type=\"button\" class=\"tab\" role=\"tab\" data-cat=\"motiv\" aria-selected=\"true\">Motivation<\/button>\n      <button type=\"button\" class=\"tab\" role=\"tab\" data-cat=\"montage\" aria-selected=\"false\">Montage<\/button>\n    <\/div>\n    <div class=\"pensee-card\" id=\"pn-card\" role=\"button\" tabindex=\"0\" aria-label=\"Tourner la carte pour voir une autre pensée\">\n      <p id=\"pn-text\" class=\"pensee-t\" aria-live=\"polite\">Chargement de la pensée…<\/p>\n    <\/div>\n    <div class=\"pensee-ctl\">\n      <button type=\"button\" class=\"chip\" id=\"pn-prev\">← Précédente<\/button>\n      <button type=\"button\" class=\"chip\" id=\"pn-rand\">Au hasard<\/button>\n      <button type=\"button\" class=\"chip\" id=\"pn-next\">Suivante →<\/button>\n    <\/div>\n  <\/div>\n<\/section>\n<main class=\"wrap\">\n  <aside class=\"photo\"><img src=\"img/photo-6.jpg\" alt=\"Wadley PIERRE, directeur de l'école\" width=\"600\" loading=\"eager\"><\/aside>\n  <article>\n\n<h1>Méthodes, ressources et évaluation<\/h1>\n<h2>VII. Méthodes et stratégies pédagogiques<\/h2>\n<p>La formation repose sur une pédagogie active centrée sur la pratique. Le formateur présente une notion, démontre son application, puis accompagne les apprenants dans la réalisation d'un exercice.<\/p>\n<div class=\"tw\"><table class=\"\"><thead><tr><th>Méthode<\/th><th>Application pédagogique<\/th><\/tr><\/thead><tbody><tr><td>Exposé interactif<\/td><td>Présenter les concepts, le vocabulaire et les règles techniques.<\/td><\/tr><tr><td>Démonstration<\/td><td>Montrer les réglages du smartphone et les opérations de montage.<\/td><\/tr><tr><td>Apprentissage par la pratique<\/td><td>Faire réaliser des exercices individuels de prise de vue et de montage.<\/td><\/tr><tr><td>Travail collaboratif<\/td><td>Organiser des interviews, reportages et tournages en petits groupes.<\/td><\/tr><tr><td>Analyse critique<\/td><td>Examiner les productions afin d'identifier les points forts et les erreurs.<\/td><\/tr><tr><td>Apprentissage par projet<\/td><td>Faire concevoir et réaliser une vidéo complète en fin de parcours.<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>Organisation indicative d'une séance de cinq heures<\/h3>\n<div class=\"tw\"><table class=\"\"><thead><tr><th>Moment<\/th><th>Durée<\/th><\/tr><\/thead><tbody><tr><td>Introduction et rappel<\/td><td>30 min<\/td><\/tr><tr><td>Apports théoriques<\/td><td>1 h<\/td><\/tr><tr><td>Démonstration guidée<\/td><td>45 min<\/td><\/tr><tr><td>Exercices pratiques<\/td><td>2 h<\/td><\/tr><tr><td>Évaluation et bilan<\/td><td>45 min<\/td><\/tr><\/tbody><\/table><\/div>\n<p class=\"note\">Répartition indicative : le temps consacré à la pratique peut augmenter pendant les séances de tournage et le projet final.<\/p>\n\n<h2>VIII. Matériel et ressources nécessaires<\/h2>\n<p>La formation doit rester réalisable avec un équipement accessible. L'achat d'une caméra professionnelle n'est pas une condition préalable.<\/p>\n<div class=\"cards\">\n  <div class=\"card\"><h3>1. Matériel de prise de vue<\/h3><ul><li>Smartphone avec caméra fonctionnelle.<\/li><li>Trépied ou support stable, si disponible.<\/li><li>Chargeur et espace de stockage suffisant.<\/li><li>Chiffon doux pour nettoyer l'objectif.<\/li><\/ul><\/div>\n  <div class=\"card\"><h3>2. Matériel sonore<\/h3><ul><li>Microphone intégré au smartphone.<\/li><li>Écouteurs ou casque pour vérifier les enregistrements.<\/li><li>Microphone externe compatible, si disponible.<\/li><li>Pièce calme pour les interviews et les voix off.<\/li><\/ul><\/div>\n  <div class=\"card\"><h3>3. Matériel informatique<\/h3><ul><li>Ordinateur compatible avec un logiciel de montage.<\/li><li>Espace de stockage pour les fichiers vidéo.<\/li><li>Souris et casque, si disponibles.<\/li><li>Support de sauvegarde externe facultatif.<\/li><\/ul><\/div>\n<\/div>\n<h3>Logiciels et applications recommandés<\/h3>\n<p>Les outils suivants peuvent être envisagés selon le matériel, le budget et les besoins de la formation.<\/p>\n<ul><li><b>CapCut<\/b> : pour découvrir les opérations courantes de montage.<\/li><li><b>Shotcut<\/b> : pour apprendre le montage sur ordinateur avec un outil gratuit.<\/li><li><b>DaVinci Resolve<\/b> : pour les ordinateurs suffisamment performants et les apprenants souhaitant approfondir leurs compétences.<\/li><li><b>VLC media player<\/b> : pour vérifier la lecture des fichiers exportés.<\/li><\/ul>\n<p>Le formateur choisira un seul logiciel principal pour l'ensemble de la formation afin d'éviter de disperser les apprentissages. Il vérifiera préalablement la compatibilité du logiciel avec les ordinateurs des participants.<\/p>\n\n<h2>IX. Système d'évaluation des apprentissages<\/h2>\n<p>L'évaluation se déroule à trois moments : au début, pendant la formation et à la fin.<\/p>\n<h3>1. Évaluation diagnostique<\/h3>\n<p>Elle permet de déterminer le niveau de départ des participants. Exemples de questions :<\/p>\n<ul><li>Avez-vous déjà filmé une vidéo avec un smartphone ?<\/li><li>Savez-vous transférer une vidéo sur un ordinateur ?<\/li><li>Avez-vous déjà utilisé un logiciel de montage ?<\/li><li>Quels types de vidéos souhaitez-vous apprendre à réaliser ?<\/li><\/ul>\n<p>Cette évaluation n'est pas nécessairement notée.<\/p>\n<h3>2. Évaluation formative<\/h3>\n<p>Elle intervient pendant les séances à travers les exercices de cadrage, d'exposition, de prise de son, de scénario et de montage. Le formateur fournit des corrections permettant à l'apprenant de progresser avant le projet final.<\/p>\n<h3>3. Évaluation sommative<\/h3>\n<p>La pondération suivante est proposée pour la certification ou l'attestation de fin de formation.<\/p>\n<div class=\"tw\"><table class=\"\"><thead><tr><th>Épreuve<\/th><th>Pondération<\/th><\/tr><\/thead><tbody><tr><td>Connaissances théoriques et vocabulaire audiovisuel<\/td><td>15 %<\/td><\/tr><tr><td>Exercices techniques de tournage<\/td><td>25 %<\/td><\/tr><tr><td>Dossier de préproduction<\/td><td>15 %<\/td><\/tr><tr><td>Projet vidéo final<\/td><td>35 %<\/td><\/tr><tr><td>Présentation orale et autoévaluation<\/td><td>10 %<\/td><\/tr><tr><td><b>Total<\/b><\/td><td><b>100 %<\/b><\/td><\/tr><\/tbody><\/table><\/div>\n\n<h3>Grille d'évaluation du projet final<\/h3>\n<p>Le formateur attribue une note à chaque critère. Le total est calculé automatiquement sur 100 points.<\/p>\n<div class=\"tw\"><table id=\"grille\"><thead><tr><th>Critère<\/th><th>Note<\/th><\/tr><\/thead><tbody><tr><td>Préproduction et cohérence du message<\/td><td class=\"num\"><input type=\"number\" min=\"0\" max=\"10\" value=\"0\" data-max=\"10\" aria-label=\"Note pour Préproduction et cohérence du message\"> / 10<\/td><\/tr><tr><td>Cadrage, composition et stabilité<\/td><td class=\"num\"><input type=\"number\" min=\"0\" max=\"20\" value=\"0\" data-max=\"20\" aria-label=\"Note pour Cadrage, composition et stabilité\"> / 20<\/td><\/tr><tr><td>Exposition et qualité de l'image<\/td><td class=\"num\"><input type=\"number\" min=\"0\" max=\"10\" value=\"0\" data-max=\"10\" aria-label=\"Note pour Exposition et qualité de l'image\"> / 10<\/td><\/tr><tr><td>Qualité et intelligibilité du son<\/td><td class=\"num\"><input type=\"number\" min=\"0\" max=\"15\" value=\"0\" data-max=\"15\" aria-label=\"Note pour Qualité et intelligibilité du son\"> / 15<\/td><\/tr><tr><td>Montage, rythme et continuité<\/td><td class=\"num\"><input type=\"number\" min=\"0\" max=\"20\" value=\"0\" data-max=\"20\" aria-label=\"Note pour Montage, rythme et continuité\"> / 20<\/td><\/tr><tr><td>Titres, musique et habillage<\/td><td class=\"num\"><input type=\"number\" min=\"0\" max=\"10\" value=\"0\" data-max=\"10\" aria-label=\"Note pour Titres, musique et habillage\"> / 10<\/td><\/tr><tr><td>Exportation et respect des règles éthiques<\/td><td class=\"num\"><input type=\"number\" min=\"0\" max=\"15\" value=\"0\" data-max=\"15\" aria-label=\"Note pour Exportation et respect des règles éthiques\"> / 15<\/td><\/tr><\/tbody>\n<tfoot><tr><td><b>Note du projet final<\/b><\/td><td class=\"num\"><b id=\"total\">0<\/b> / 100<\/td><\/tr><\/tfoot><\/table><\/div>\n<p><button class=\"btn small\" type=\"button\" id=\"reset\">Réinitialiser les notes<\/button><\/p>\n<p class=\"note\">Cette grille évalue uniquement le projet final. Les critères de réussite et le seuil d'obtention d'une attestation devront être fixés par l'organisme responsable de la formation.<\/p>\n<script>\n(function(){\n  var inputs=[].slice.call(document.querySelectorAll('#grille input'));\n  function calc(){\n    var t=0;\n    inputs.forEach(function(i){\n      var m=+i.dataset.max,v=parseFloat(i.value);\n      if(isNaN(v)||v<0)v=0; if(v>m){v=m;i.value=m;}\n      t+=v;\n    });\n    document.getElementById('total').textContent=t;\n  }\n  inputs.forEach(function(i){i.addEventListener('input',calc);});\n  document.getElementById('reset').addEventListener('click',function(){inputs.forEach(function(i){i.value=0;});calc();});\n})();\n<\/script>\n\n    <div class=\"pager\"><a href=\"tutoriels.html\">← Tutoriels YouTube<\/a><a href=\"ethique-ressources.html\">Éthique et ressources →<\/a><\/div>\n  <\/article>\n<\/main>\n<footer class=\"foot\">\n  <div class=\"sign\">\n    <img class=\"seal-oval\" src=\"img/sceau.jpg\" alt=\"Sceau de l'école, Marc Colbert PIERRE, école de vidéographie\">\n    <div class=\"sigbox\"><img src=\"img/signature.png\" alt=\"Signature de Wadley PIERRE\"><b>WADLEY PIERRE<\/b><span>Directeur<\/span><\/div>\n  <\/div>\n  <p>Marc Colbert PIERRE · École de vidéographie — Initiation à la vidéographie · 60 heures<\/p>\n<\/footer>\n<!--@2@-->\n<!--@3@-->\n<!--@0@--><\/body>\n<\/html>\n","index":"<!doctype html>\n<html lang=\"fr\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Initiation à la vidéographie<\/title>\n<meta name=\"claude:viewport-fit-sides\" content=\"cover\">\n<!--@1@-->\n<\/head>\n<body>\n<header class=\"top\">\n  <a class=\"brand\" href=\"index.html\"><img src=\"img/logo.png\" alt=\"Logo de l'établissement Marc Colbert PIERRE, école de vidéographie\"><span><b>Marc Colbert PIERRE<\/b><small>École de vidéographie<\/small><\/span><\/a>\n  <span id=\"access-chip\"><\/span>\n  <button class=\"burger\" aria-label=\"Menu\" onclick=\"document.body.classList.toggle('open')\">☰<\/button>\n  <nav><a href=\"index.html\" class=on>Accueil<\/a><a href=\"objectifs.html\">Objectifs<\/a><a href=\"seances-1-4.html\">Séances 1 à 4<\/a><a href=\"seances-5-8.html\">Séances 5 à 8<\/a><a href=\"seances-9-12.html\">Séances 9 à 12<\/a><a href=\"dictionnaire.html\">Dictionnaire<\/a><a href=\"quiz.html\">Quiz<\/a><a href=\"tutoriels.html\">Tutoriels YouTube<\/a><a href=\"evaluation.html\">Évaluation<\/a><a href=\"ethique-ressources.html\">Éthique et ressources<\/a><a href=\"certification.html\">Certification<\/a><\/nav>\n<\/header>\n<section class=\"banner\"><img src=\"img/miniature.jpg\" alt=\"Marc Colbert PIERRE, école de vidéographie : prise de vue, montage, édition, créativité\" width=\"1672\" height=\"941\"><\/section>\n<section class=\"pensee\" data-mode=\"tous\" aria-label=\"Pensées de motivation et d'inspiration\">\n  <div class=\"pensee-in\">\n    <p class=\"pensee-k\">Pensées<\/p>\n    <div class=\"pensee-tabs\" role=\"tablist\" aria-label=\"Choisir le thème des pensées\">\n      <button type=\"button\" class=\"tab\" role=\"tab\" data-cat=\"motiv\" aria-selected=\"true\">Motivation<\/button>\n      <button type=\"button\" class=\"tab\" role=\"tab\" data-cat=\"montage\" aria-selected=\"false\">Montage<\/button>\n    <\/div>\n    <div class=\"pensee-card\" id=\"pn-card\" role=\"button\" tabindex=\"0\" aria-label=\"Tourner la carte pour voir une autre pensée\">\n      <p id=\"pn-text\" class=\"pensee-t\" aria-live=\"polite\">Chargement de la pensée…<\/p>\n    <\/div>\n    <div class=\"pensee-ctl\">\n      <button type=\"button\" class=\"chip\" id=\"pn-prev\">← Précédente<\/button>\n      <button type=\"button\" class=\"chip\" id=\"pn-rand\">Au hasard<\/button>\n      <button type=\"button\" class=\"chip\" id=\"pn-next\">Suivante →<\/button>\n    <\/div>\n  <\/div>\n<\/section>\n<main class=\"wrap\">\n  <aside class=\"photo\"><img src=\"img/photo-1.jpg\" alt=\"Wadley PIERRE, directeur de l'école\" width=\"600\" loading=\"eager\"><\/aside>\n  <article>\n\n<p class=\"kicker\">Plan de cours complet<\/p>\n<h1>Initiation à la vidéographie<\/h1>\n<p class=\"lead\">Marc Colbert PIERRE · École de vidéographie<\/p>\n\n<h2>Fiche d'identification du cours<\/h2>\n<div class=\"tw\"><table class=\"fiche\"><thead><tr><th>Rubrique<\/th><th>Information<\/th><\/tr><\/thead><tbody><tr><td>Nom de l'école<\/td><td>Marc Colbert PIERRE École de vidéographie<\/td><\/tr><tr><td>Directeur<\/td><td>Wadley PIERRE<\/td><\/tr><tr><td>Intitulé<\/td><td>Initiation à la vidéographie<\/td><\/tr><tr><td>Niveau<\/td><td>Débutant<\/td><\/tr><tr><td>Public cible<\/td><td>Jeunes et adultes<\/td><\/tr><tr><td>Durée totale<\/td><td>60 heures<\/td><\/tr><tr><td>Modalité<\/td><td>Formation théorique et pratique<\/td><\/tr><tr><td>Matériel principal<\/td><td>Smartphone et ordinateur<\/td><\/tr><tr><td>Approche<\/td><td>Pédagogie active, démonstrations, exercices progressifs et apprentissage par projet.<\/td><\/tr><tr><td>Production finale<\/td><td>Réalisation d'une vidéo de 2 à 3 minutes, du scénario à l'exportation.<\/td><\/tr><\/tbody><\/table><\/div>\n\n<h2>I. Présentation générale du cours<\/h2>\n<p>La vidéographie est une discipline audiovisuelle qui consiste à concevoir, enregistrer et produire des contenus vidéo destinés à informer, former, documenter, communiquer ou divertir. Elle mobilise des compétences techniques, artistiques et organisationnelles liées à la prise de vue, à la composition de l'image, à l'éclairage, à la prise de son, à la narration et au montage.<\/p>\n<p>Ce cours est conçu pour les jeunes et les adultes qui souhaitent apprendre à produire des vidéos de qualité à partir d'un smartphone et d'un ordinateur, même sans expérience préalable ni équipement professionnel coûteux.<\/p>\n<p>La formation privilégie une progression allant de la découverte des outils à la réalisation autonome d'un projet audiovisuel. Elle prend notamment en compte les usages contemporains de la vidéo dans l'éducation, le journalisme, la communication institutionnelle, la musique, les activités communautaires et les réseaux sociaux.<\/p>\n<div class=\"cta\"><a class=\"btn\" href=\"objectifs.html\">Voir les objectifs et l'organisation →<\/a><\/div>\n\n    <div class=\"pager\"><span><\/span><a href=\"objectifs.html\">Objectifs →<\/a><\/div>\n  <\/article>\n<\/main>\n<footer class=\"foot\">\n  <div class=\"sign\">\n    <img class=\"seal-oval\" src=\"img/sceau.jpg\" alt=\"Sceau de l'école, Marc Colbert PIERRE, école de vidéographie\">\n    <div class=\"sigbox\"><img src=\"img/signature.png\" alt=\"Signature de Wadley PIERRE\"><b>WADLEY PIERRE<\/b><span>Directeur<\/span><\/div>\n  <\/div>\n  <p>Marc Colbert PIERRE · École de vidéographie — Initiation à la vidéographie · 60 heures<\/p>\n<\/footer>\n<!--@2@-->\n<!--@3@-->\n<!--@0@--><\/body>\n<\/html>\n","objectifs":"<!doctype html>\n<html lang=\"fr\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Objectifs<\/title>\n<meta name=\"claude:viewport-fit-sides\" content=\"cover\">\n<!--@1@-->\n<\/head>\n<body>\n<header class=\"top\">\n  <a class=\"brand\" href=\"index.html\"><img src=\"img/logo.png\" alt=\"Logo de l'établissement Marc Colbert PIERRE, école de vidéographie\"><span><b>Marc Colbert PIERRE<\/b><small>École de vidéographie<\/small><\/span><\/a>\n  <span id=\"access-chip\"><\/span>\n  <button class=\"burger\" aria-label=\"Menu\" onclick=\"document.body.classList.toggle('open')\">☰<\/button>\n  <nav><a href=\"index.html\">Accueil<\/a><a href=\"objectifs.html\" class=on>Objectifs<\/a><a href=\"seances-1-4.html\">Séances 1 à 4<\/a><a href=\"seances-5-8.html\">Séances 5 à 8<\/a><a href=\"seances-9-12.html\">Séances 9 à 12<\/a><a href=\"dictionnaire.html\">Dictionnaire<\/a><a href=\"quiz.html\">Quiz<\/a><a href=\"tutoriels.html\">Tutoriels YouTube<\/a><a href=\"evaluation.html\">Évaluation<\/a><a href=\"ethique-ressources.html\">Éthique et ressources<\/a><a href=\"certification.html\">Certification<\/a><\/nav>\n<\/header>\n<section class=\"banner\"><img src=\"img/miniature.jpg\" alt=\"Marc Colbert PIERRE, école de vidéographie : prise de vue, montage, édition, créativité\" width=\"1672\" height=\"941\"><\/section>\n<section class=\"pensee\" data-mode=\"tous\" aria-label=\"Pensées de motivation et d'inspiration\">\n  <div class=\"pensee-in\">\n    <p class=\"pensee-k\">Pensées<\/p>\n    <div class=\"pensee-tabs\" role=\"tablist\" aria-label=\"Choisir le thème des pensées\">\n      <button type=\"button\" class=\"tab\" role=\"tab\" data-cat=\"motiv\" aria-selected=\"true\">Motivation<\/button>\n      <button type=\"button\" class=\"tab\" role=\"tab\" data-cat=\"montage\" aria-selected=\"false\">Montage<\/button>\n    <\/div>\n    <div class=\"pensee-card\" id=\"pn-card\" role=\"button\" tabindex=\"0\" aria-label=\"Tourner la carte pour voir une autre pensée\">\n      <p id=\"pn-text\" class=\"pensee-t\" aria-live=\"polite\">Chargement de la pensée…<\/p>\n    <\/div>\n    <div class=\"pensee-ctl\">\n      <button type=\"button\" class=\"chip\" id=\"pn-prev\">← Précédente<\/button>\n      <button type=\"button\" class=\"chip\" id=\"pn-rand\">Au hasard<\/button>\n      <button type=\"button\" class=\"chip\" id=\"pn-next\">Suivante →<\/button>\n    <\/div>\n  <\/div>\n<\/section>\n<main class=\"wrap\">\n  <aside class=\"photo\"><img src=\"img/photo-6.jpg\" alt=\"Wadley PIERRE, directeur de l'école\" width=\"600\" loading=\"eager\"><\/aside>\n  <article>\n\n<h1>Objectifs et organisation<\/h1>\n<h2>II. Objectif général<\/h2>\n<p>À l'issue des 60 heures de formation, l'apprenant sera capable de concevoir, filmer, monter, exporter et présenter une production vidéo simple, cohérente et techniquement exploitable en utilisant un smartphone et un ordinateur.<\/p>\n\n<h2>III. Objectifs spécifiques<\/h2>\n<p>L'apprenant devra être capable de :<\/p>\n<ol><li>Définir la vidéographie et distinguer ses principales applications.<\/li><li>Identifier les fonctions d'un smartphone et les accessoires utiles à la production vidéo.<\/li><li>Configurer les principaux paramètres d'enregistrement vidéo.<\/li><li>Appliquer les règles de cadrage, de composition et de mouvement de caméra.<\/li><li>Utiliser la lumière naturelle et contrôler les conditions élémentaires d'éclairage.<\/li><li>Enregistrer une voix et des sons d'ambiance intelligibles.<\/li><li>Préparer un projet à l'aide d'un synopsis, d'un scénario et d'un plan de tournage.<\/li><li>Réaliser une interview, une séquence narrative ou un court reportage.<\/li><li>Organiser les fichiers audiovisuels et effectuer un montage sur ordinateur.<\/li><li>Ajouter des titres, des transitions maîtrisées, une musique autorisée et une voix off.<\/li><li>Exporter une vidéo selon les exigences d'une plateforme de diffusion.<\/li><li>Respecter les principes éthiques, le droit à l'image et les droits d'auteur.<\/li><li>Évaluer et améliorer sa propre production à partir de critères objectifs.<\/li><\/ol>\n\n<h2>IV. Compétences visées<\/h2>\n<p>À la fin du parcours, l'apprenant aura développé trois catégories de compétences.<\/p>\n<div class=\"cards\">\n  <div class=\"card\"><h3>Compétences techniques<\/h3><p>Configurer un smartphone, stabiliser l'image, maîtriser l'exposition de base, enregistrer le son et utiliser un logiciel de montage.<\/p><\/div>\n  <div class=\"card\"><h3>Compétences créatives<\/h3><p>Construire une séquence, choisir les plans pertinents, raconter une histoire en images et organiser le rythme d'une vidéo.<\/p><\/div>\n  <div class=\"card\"><h3>Compétences professionnelles et éthiques<\/h3><p>Préparer un tournage, travailler en équipe, respecter les personnes filmées et livrer une production conforme à une consigne.<\/p><\/div>\n<\/div>\n\n<h2>V. Organisation générale de la formation<\/h2>\n<p>La formation est répartie en 12 séances de 5 heures, soit 60 heures au total. Chaque séance comprend des apports théoriques, des démonstrations, des exercices pratiques et une évaluation formative.<\/p>\n<div class=\"tw\"><table class=\"\"><thead><tr><th>Phase<\/th><th>Contenu<\/th><th>Durée<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>Fondements de la vidéographie<\/td><td>5 h<\/td><\/tr><tr><td>2<\/td><td>Smartphone et réglages de prise de vue<\/td><td>5 h<\/td><\/tr><tr><td>3<\/td><td>Cadrage et composition de l'image<\/td><td>5 h<\/td><\/tr><tr><td>4<\/td><td>Mouvements de caméra et continuité visuelle<\/td><td>5 h<\/td><\/tr><tr><td>5<\/td><td>Lumière et exposition<\/td><td>5 h<\/td><\/tr><tr><td>6<\/td><td>Prise de son<\/td><td>5 h<\/td><\/tr><tr><td>7<\/td><td>Préproduction et écriture audiovisuelle<\/td><td>5 h<\/td><\/tr><tr><td>8<\/td><td>Techniques de tournage et interview<\/td><td>5 h<\/td><\/tr><tr><td>9<\/td><td>Initiation au montage vidéo<\/td><td>5 h<\/td><\/tr><tr><td>10<\/td><td>Montage avancé et habillage sonore<\/td><td>5 h<\/td><\/tr><tr><td>11<\/td><td>Exportation, diffusion et éthique<\/td><td>5 h<\/td><\/tr><tr><td>12<\/td><td>Réalisation et présentation du projet final<\/td><td>5 h<\/td><\/tr><tr><td><b>Total<\/b><\/td><td><b>12 séances<\/b><\/td><td><b>60 h<\/b><\/td><\/tr><\/tbody><\/table><\/div>\n\n    <div class=\"pager\"><a href=\"index.html\">← Accueil<\/a><a href=\"seances-1-4.html\">Séances 1 à 4 →<\/a><\/div>\n  <\/article>\n<\/main>\n<footer class=\"foot\">\n  <div class=\"sign\">\n    <img class=\"seal-oval\" src=\"img/sceau.jpg\" alt=\"Sceau de l'école, Marc Colbert PIERRE, école de vidéographie\">\n    <div class=\"sigbox\"><img src=\"img/signature.png\" alt=\"Signature de Wadley PIERRE\"><b>WADLEY PIERRE<\/b><span>Directeur<\/span><\/div>\n  <\/div>\n  <p>Marc Colbert PIERRE · École de vidéographie — Initiation à la vidéographie · 60 heures<\/p>\n<\/footer>\n<!--@2@-->\n<!--@3@-->\n<!--@0@--><\/body>\n<\/html>\n","quiz":"<!doctype html>\n<html lang=\"fr\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Quiz<\/title>\n<meta name=\"claude:viewport-fit-sides\" content=\"cover\">\n<!--@1@-->\n<\/head>\n<body>\n<header class=\"top\">\n  <a class=\"brand\" href=\"index.html\"><img src=\"img/logo.png\" alt=\"Logo de l'établissement Marc Colbert PIERRE, école de vidéographie\"><span><b>Marc Colbert PIERRE<\/b><small>École de vidéographie<\/small><\/span><\/a>\n  <span id=\"access-chip\"><\/span>\n  <button class=\"burger\" aria-label=\"Menu\" onclick=\"document.body.classList.toggle('open')\">☰<\/button>\n  <nav><a href=\"index.html\">Accueil<\/a><a href=\"objectifs.html\">Objectifs<\/a><a href=\"seances-1-4.html\">Séances 1 à 4<\/a><a href=\"seances-5-8.html\">Séances 5 à 8<\/a><a href=\"seances-9-12.html\">Séances 9 à 12<\/a><a href=\"dictionnaire.html\">Dictionnaire<\/a><a href=\"quiz.html\" class=on>Quiz<\/a><a href=\"tutoriels.html\">Tutoriels YouTube<\/a><a href=\"evaluation.html\">Évaluation<\/a><a href=\"ethique-ressources.html\">Éthique et ressources<\/a><a href=\"certification.html\">Certification<\/a><\/nav>\n<\/header>\n<section class=\"banner\"><img src=\"img/miniature.jpg\" alt=\"Marc Colbert PIERRE, école de vidéographie : prise de vue, montage, édition, créativité\" width=\"1672\" height=\"941\"><\/section>\n<section class=\"pensee\" data-mode=\"tous\" aria-label=\"Pensées de motivation et d'inspiration\">\n  <div class=\"pensee-in\">\n    <p class=\"pensee-k\">Pensées<\/p>\n    <div class=\"pensee-tabs\" role=\"tablist\" aria-label=\"Choisir le thème des pensées\">\n      <button type=\"button\" class=\"tab\" role=\"tab\" data-cat=\"motiv\" aria-selected=\"true\">Motivation<\/button>\n      <button type=\"button\" class=\"tab\" role=\"tab\" data-cat=\"montage\" aria-selected=\"false\">Montage<\/button>\n    <\/div>\n    <div class=\"pensee-card\" id=\"pn-card\" role=\"button\" tabindex=\"0\" aria-label=\"Tourner la carte pour voir une autre pensée\">\n      <p id=\"pn-text\" class=\"pensee-t\" aria-live=\"polite\">Chargement de la pensée…<\/p>\n    <\/div>\n    <div class=\"pensee-ctl\">\n      <button type=\"button\" class=\"chip\" id=\"pn-prev\">← Précédente<\/button>\n      <button type=\"button\" class=\"chip\" id=\"pn-rand\">Au hasard<\/button>\n      <button type=\"button\" class=\"chip\" id=\"pn-next\">Suivante →<\/button>\n    <\/div>\n  <\/div>\n<\/section>\n<main class=\"wrap\">\n  <aside class=\"photo\"><img src=\"img/photo-7.jpg\" alt=\"Wadley PIERRE, directeur de l'école\" width=\"600\" loading=\"eager\"><\/aside>\n  <article>\n\n<p class=\"kicker\">Révision<\/p>\n<h1>Test de connaissances<\/h1>\n<p class=\"lead\">Huit questions pour vérifier le vocabulaire de base. Répondez à toutes les questions, puis cliquez sur « Corriger le quiz ».<\/p>\n<p class=\"muted\"><span id=\"q-count\">0<\/span>/8 réponses<\/p>\n<form id=\"quiz\" onsubmit=\"return false\">\n<fieldset class=\"q\" id=\"fq0\" data-good=\"1\"><legend>1. Quelle est la phase qui comprend le scénario et le plan de tournage ?<\/legend><label class=\"opt\"><input type=\"radio\" name=\"q0\" value=\"0\"> <span>La production<\/span><\/label><label class=\"opt\"><input type=\"radio\" name=\"q0\" value=\"1\"> <span>La préproduction<\/span><\/label><label class=\"opt\"><input type=\"radio\" name=\"q0\" value=\"2\"> <span>La postproduction<\/span><\/label><p class=\"why\" hidden>La préproduction regroupe la recherche du sujet, le scénario, le choix des lieux et l'organisation du tournage.<\/p><\/fieldset><fieldset class=\"q\" id=\"fq1\" data-good=\"0\"><legend>2. À quoi sert principalement la mise au point ?<\/legend><label class=\"opt\"><input type=\"radio\" name=\"q1\" value=\"0\"> <span>À rendre le sujet net<\/span><\/label><label class=\"opt\"><input type=\"radio\" name=\"q1\" value=\"1\"> <span>À augmenter le volume sonore<\/span><\/label><label class=\"opt\"><input type=\"radio\" name=\"q1\" value=\"2\"> <span>À réduire la taille du fichier<\/span><\/label><p class=\"why\" hidden>La mise au point rend net le sujet ou la zone que l'on veut montrer avec précision.<\/p><\/fieldset><fieldset class=\"q\" id=\"fq2\" data-good=\"1\"><legend>3. Quel plan permet généralement de voir un personnage en pied ?<\/legend><label class=\"opt\"><input type=\"radio\" name=\"q2\" value=\"0\"> <span>Le gros plan<\/span><\/label><label class=\"opt\"><input type=\"radio\" name=\"q2\" value=\"1\"> <span>Le plan moyen<\/span><\/label><label class=\"opt\"><input type=\"radio\" name=\"q2\" value=\"2\"> <span>Le plan général<\/span><\/label><p class=\"why\" hidden>Le plan moyen montre généralement un personnage en pied, avec sa posture et ses actions.<\/p><\/fieldset><fieldset class=\"q\" id=\"fq3\" data-good=\"1\"><legend>4. Qu'est-ce qu'une voix off ?<\/legend><label class=\"opt\"><input type=\"radio\" name=\"q3\" value=\"0\"> <span>Une musique de fond<\/span><\/label><label class=\"opt\"><input type=\"radio\" name=\"q3\" value=\"1\"> <span>Une narration qui n'est pas nécessairement visible<\/span><\/label><label class=\"opt\"><input type=\"radio\" name=\"q3\" value=\"2\"> <span>Un mouvement de caméra<\/span><\/label><p class=\"why\" hidden>La voix off est une narration entendue sans que la personne qui parle soit forcément à l'écran.<\/p><\/fieldset><fieldset class=\"q\" id=\"fq4\" data-good=\"0\"><legend>5. À quoi sert la timeline d'un logiciel de montage ?<\/legend><label class=\"opt\"><input type=\"radio\" name=\"q4\" value=\"0\"> <span>À organiser les clips dans le temps<\/span><\/label><label class=\"opt\"><input type=\"radio\" name=\"q4\" value=\"1\"> <span>À nettoyer l'objectif<\/span><\/label><label class=\"opt\"><input type=\"radio\" name=\"q4\" value=\"2\"> <span>À régler physiquement le microphone<\/span><\/label><p class=\"why\" hidden>La timeline est l'espace où les clips vidéo et audio sont disposés selon leur position dans le temps.<\/p><\/fieldset><fieldset class=\"q\" id=\"fq5\" data-good=\"1\"><legend>6. Quel est le rôle de l'exportation ?<\/legend><label class=\"opt\"><input type=\"radio\" name=\"q5\" value=\"0\"> <span>De préparer le storyboard<\/span><\/label><label class=\"opt\"><input type=\"radio\" name=\"q5\" value=\"1\"> <span>De créer le fichier vidéo final<\/span><\/label><label class=\"opt\"><input type=\"radio\" name=\"q5\" value=\"2\"> <span>De choisir les personnes à filmer<\/span><\/label><p class=\"why\" hidden>L'exportation produit le fichier vidéo final à partir du projet de montage.<\/p><\/fieldset><fieldset class=\"q\" id=\"fq6\" data-good=\"0\"><legend>7. Pourquoi faut-il contrôler le son pendant le tournage ?<\/legend><label class=\"opt\"><input type=\"radio\" name=\"q6\" value=\"0\"> <span>Pour vérifier son intelligibilité et éviter la saturation<\/span><\/label><label class=\"opt\"><input type=\"radio\" name=\"q6\" value=\"1\"> <span>Pour augmenter la résolution de l'image<\/span><\/label><label class=\"opt\"><input type=\"radio\" name=\"q6\" value=\"2\"> <span>Pour modifier la balance des blancs<\/span><\/label><p class=\"why\" hidden>Un son clair et sans saturation est indispensable au montage ; on le contrôle au casque pendant le tournage.<\/p><\/fieldset><fieldset class=\"q\" id=\"fq7\" data-good=\"1\"><legend>8. Que faut-il vérifier avant de publier une vidéo contenant une interview ?<\/legend><label class=\"opt\"><input type=\"radio\" name=\"q7\" value=\"0\"> <span>Uniquement la couleur du titre<\/span><\/label><label class=\"opt\"><input type=\"radio\" name=\"q7\" value=\"1\"> <span>Les autorisations, les droits et la qualité finale<\/span><\/label><label class=\"opt\"><input type=\"radio\" name=\"q7\" value=\"2\"> <span>Uniquement le nombre de plans<\/span><\/label><p class=\"why\" hidden>Avant toute diffusion, on vérifie le consentement, les droits et le contrôle qualité du produit final.<\/p><\/fieldset>\n<div class=\"actions\"><button type=\"button\" class=\"btn\" id=\"q-check\">Corriger le quiz<\/button>\n<button type=\"button\" class=\"btn ghost\" id=\"q-reset\">Recommencer<\/button><\/div>\n<p id=\"q-result\" class=\"result\" hidden><\/p>\n<\/form>\n<script>\n(function(){\n  var qs=[].slice.call(document.querySelectorAll('.q')),cnt=document.getElementById('q-count'),res=document.getElementById('q-result');\n  function answered(){return qs.filter(function(q){return q.querySelector('input:checked');}).length;}\n  document.getElementById('quiz').addEventListener('change',function(){cnt.textContent=answered();});\n  document.getElementById('q-check').addEventListener('click',function(){\n    var ok=0;\n    qs.forEach(function(q){\n      var g=+q.dataset.good,sel=q.querySelector('input:checked');\n      q.classList.remove('good','bad');\n      [].forEach.call(q.querySelectorAll('.opt'),function(o){o.classList.remove('is-good','is-bad');});\n      q.querySelectorAll('.opt')[g].classList.add('is-good');\n      if(sel&&+sel.value===g){ok++;q.classList.add('good');}\n      else{q.classList.add('bad');if(sel)sel.closest('.opt').classList.add('is-bad');}\n      q.querySelector('.why').hidden=false;\n    });\n    var left=qs.length-answered();\n    res.hidden=false;\n    res.textContent='Score : '+ok+' / '+qs.length+(left?' ('+left+' question'+(left>1?'s':'')+' sans réponse)':'')+'.';\n    res.scrollIntoView({behavior:'smooth',block:'nearest'});\n  });\n  document.getElementById('q-reset').addEventListener('click',function(){\n    document.getElementById('quiz').reset();cnt.textContent='0';res.hidden=true;\n    qs.forEach(function(q){q.classList.remove('good','bad');q.querySelector('.why').hidden=true;[].forEach.call(q.querySelectorAll('.opt'),function(o){o.classList.remove('is-good','is-bad');});});\n  });\n})();\n<\/script>\n\n    <div class=\"pager\"><a href=\"dictionnaire.html\">← Dictionnaire<\/a><a href=\"tutoriels.html\">Tutoriels YouTube →<\/a><\/div>\n  <\/article>\n<\/main>\n<footer class=\"foot\">\n  <div class=\"sign\">\n    <img class=\"seal-oval\" src=\"img/sceau.jpg\" alt=\"Sceau de l'école, Marc Colbert PIERRE, école de vidéographie\">\n    <div class=\"sigbox\"><img src=\"img/signature.png\" alt=\"Signature de Wadley PIERRE\"><b>WADLEY PIERRE<\/b><span>Directeur<\/span><\/div>\n  <\/div>\n  <p>Marc Colbert PIERRE · École de vidéographie — Initiation à la vidéographie · 60 heures<\/p>\n<\/footer>\n<!--@2@-->\n<!--@3@-->\n<!--@0@--><\/body>\n<\/html>\n","seances-1-4":"<!doctype html>\n<html lang=\"fr\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Séances 1 à 4<\/title>\n<meta name=\"claude:viewport-fit-sides\" content=\"cover\">\n<!--@1@-->\n<\/head>\n<body>\n<header class=\"top\">\n  <a class=\"brand\" href=\"index.html\"><img src=\"img/logo.png\" alt=\"Logo de l'établissement Marc Colbert PIERRE, école de vidéographie\"><span><b>Marc Colbert PIERRE<\/b><small>École de vidéographie<\/small><\/span><\/a>\n  <span id=\"access-chip\"><\/span>\n  <button class=\"burger\" aria-label=\"Menu\" onclick=\"document.body.classList.toggle('open')\">☰<\/button>\n  <nav><a href=\"index.html\">Accueil<\/a><a href=\"objectifs.html\">Objectifs<\/a><a href=\"seances-1-4.html\" class=on>Séances 1 à 4<\/a><a href=\"seances-5-8.html\">Séances 5 à 8<\/a><a href=\"seances-9-12.html\">Séances 9 à 12<\/a><a href=\"dictionnaire.html\">Dictionnaire<\/a><a href=\"quiz.html\">Quiz<\/a><a href=\"tutoriels.html\">Tutoriels YouTube<\/a><a href=\"evaluation.html\">Évaluation<\/a><a href=\"ethique-ressources.html\">Éthique et ressources<\/a><a href=\"certification.html\">Certification<\/a><\/nav>\n<\/header>\n<section class=\"banner\"><img src=\"img/miniature.jpg\" alt=\"Marc Colbert PIERRE, école de vidéographie : prise de vue, montage, édition, créativité\" width=\"1672\" height=\"941\"><\/section>\n<section class=\"pensee\" data-mode=\"tous\" aria-label=\"Pensées de motivation et d'inspiration\">\n  <div class=\"pensee-in\">\n    <p class=\"pensee-k\">Pensées<\/p>\n    <div class=\"pensee-tabs\" role=\"tablist\" aria-label=\"Choisir le thème des pensées\">\n      <button type=\"button\" class=\"tab\" role=\"tab\" data-cat=\"motiv\" aria-selected=\"true\">Motivation<\/button>\n      <button type=\"button\" class=\"tab\" role=\"tab\" data-cat=\"montage\" aria-selected=\"false\">Montage<\/button>\n    <\/div>\n    <div class=\"pensee-card\" id=\"pn-card\" role=\"button\" tabindex=\"0\" aria-label=\"Tourner la carte pour voir une autre pensée\">\n      <p id=\"pn-text\" class=\"pensee-t\" aria-live=\"polite\">Chargement de la pensée…<\/p>\n    <\/div>\n    <div class=\"pensee-ctl\">\n      <button type=\"button\" class=\"chip\" id=\"pn-prev\">← Précédente<\/button>\n      <button type=\"button\" class=\"chip\" id=\"pn-rand\">Au hasard<\/button>\n      <button type=\"button\" class=\"chip\" id=\"pn-next\">Suivante →<\/button>\n    <\/div>\n  <\/div>\n<\/section>\n<main class=\"wrap\">\n  <aside class=\"photo\"><img src=\"img/photo-2.jpg\" alt=\"Wadley PIERRE, directeur de l'école\" width=\"600\" loading=\"eager\"><\/aside>\n  <article>\n<h1>VI. Déroulement pédagogique détaillé<\/h1><p class=\"lead\">Séances 1 à 4<\/p>\n<section class=\"seance\" id=\"s1\">\n  <h2><span class=\"n\">Séance 1<\/span>Fondements de la vidéographie <small>(5 heures)<\/small><\/h2>\n  <p class=\"obj\"><b>Objectif de la séance :<\/b> Comprendre les fondements de la vidéographie, son vocabulaire et les principales étapes de production.<\/p>\n  <h3>Contenus détaillés<\/h3><ul><li>Définition de la vidéographie et de la production audiovisuelle.<\/li><li>Différences entre photographie, vidéographie, cinéma et réalisation audiovisuelle.<\/li><li>Principaux domaines d'application : reportage, interview, documentaire, publicité, musique et vidéo éducative.<\/li><li>Les trois phases de production : <b>préproduction<\/b> (préparation et organisation), <b>production<\/b> (réalisation des prises de vue et du son), <b>postproduction<\/b> (montage, correction et exportation).<\/li><li>Présentation du matériel disponible et des règles de sécurité élémentaires.<\/li><\/ul>\n  <h3>Activités pédagogiques<\/h3><ul><li>Présentation du formateur et recueil des attentes des participants.<\/li><li>Projection et analyse collective de deux courtes vidéos.<\/li><li>Identification des éléments qui rendent une vidéo claire, intéressante et compréhensible.<\/li><li>Présentation du parcours de production audiovisuelle.<\/li><\/ul>\n  <h3>Exercice pratique<\/h3>Chaque apprenant choisit une vidéo courte qu'il connaît et identifie son sujet, son public, son objectif et les moyens audiovisuels utilisés.\n  <div class=\"grid2\">\n    <p class=\"box\"><b>Évaluation formative :<\/b> Questionnaire oral ou écrit portant sur le vocabulaire de base et les trois phases de production.<\/p>\n    <p class=\"box liv\"><b>Livrable attendu :<\/b> Une fiche d'analyse d'une vidéo.<\/p>\n  <\/div>\n<\/section>\n<section class=\"seance\" id=\"s2\">\n  <h2><span class=\"n\">Séance 2<\/span>Découverte du smartphone et réglages de prise de vue <small>(5 heures)<\/small><\/h2>\n  <p class=\"obj\"><b>Objectif de la séance :<\/b> Configurer un smartphone pour réaliser des prises de vue adaptées aux besoins d'une production audiovisuelle.<\/p>\n  <h3>Contenus détaillés<\/h3><ul><li>Présentation des caméras avant et arrière, des objectifs disponibles et du zoom numérique.<\/li><li>Nettoyage de l'objectif et vérification de l'espace de stockage.<\/li><li>Choix de l'orientation : horizontale pour de nombreux usages classiques et verticale pour certains formats mobiles.<\/li><li>Résolution vidéo : HD, Full HD et 4K selon les capacités du téléphone.<\/li><li>Fréquence d'images : 24, 25, 30, 50 et 60 images par seconde selon le projet.<\/li><li>Mise au point automatique et manuelle lorsqu'elle est disponible.<\/li><li>Verrouillage de la mise au point et de l'exposition, si le téléphone le permet.<\/li><li>Différence entre zoom optique et zoom numérique.<\/li><li>Gestion de la batterie, du stockage et des fichiers.<\/li><\/ul>\n  <h3>Activités pédagogiques<\/h3><ul><li>Démonstration des réglages sur un smartphone.<\/li><li>Comparaison d'une vidéo filmée avec un zoom numérique et d'une vidéo obtenue en se rapprochant physiquement du sujet.<\/li><li>Analyse des effets de différentes résolutions et fréquences d'images.<\/li><\/ul>\n  <h3>Exercices pratiques<\/h3><ol><li>Enregistrer le même sujet en Full HD et dans une autre résolution disponible.<\/li><li>Filmer une personne immobile en ajustant la mise au point.<\/li><li>Réaliser une prise de vue horizontale et une prise de vue verticale.<\/li><li>Comparer les résultats sur l'écran de l'ordinateur.<\/li><\/ol>\n  <div class=\"grid2\">\n    <p class=\"box\"><b>Évaluation :<\/b> L'apprenant doit configurer son smartphone et produire trois clips lisibles, correctement orientés et enregistrés dans un format choisi.<\/p>\n    <p class=\"box liv\"><b>Livrable attendu :<\/b> Un dossier contenant les trois clips et une fiche de réglages.<\/p>\n  <\/div>\n<\/section>\n<section class=\"seance\" id=\"s3\">\n  <h2><span class=\"n\">Séance 3<\/span>Cadrage et composition de l'image <small>(5 heures)<\/small><\/h2>\n  <p class=\"obj\"><b>Objectif de la séance :<\/b> Composer des images lisibles et expressives en appliquant les principales règles de cadrage.<\/p>\n  <h3>Contenus détaillés<\/h3><ul><li>Définition du cadre et du champ.<\/li><li>Les échelles de plans : plan général et plan d'ensemble, plan moyen, plan américain, plan rapproché, gros plan et très gros plan.<\/li><li>Angles de prise de vue : angle neutre, plongée et contre-plongée.<\/li><li>Règle des tiers et placement du sujet.<\/li><li>Lignes directrices, profondeur et arrière-plan.<\/li><li>Espace au-dessus de la tête et espace de regard.<\/li><li>Arrière-plans encombrés, éléments distrayants et erreurs de cadrage.<\/li><li>Cohérence du cadrage avec l'intention de communication.<\/li><\/ul>\n  <h3>Activités pédagogiques<\/h3><ul><li>Analyse d'images fixes et de séquences vidéo.<\/li><li>Démonstration de l'effet d'un changement d'angle sur la perception d'un sujet.<\/li><li>Travail en binômes : un apprenant filme et l'autre joue le rôle du sujet.<\/li><\/ul>\n  <h3>Exercices pratiques<\/h3><ol><li>Réaliser cinq plans différents d'une même personne.<\/li><li>Filmer un objet en plongée, en contre-plongée et à hauteur des yeux.<\/li><li>Réaliser une courte séquence utilisant la règle des tiers.<\/li><li>Corriger un cadrage dans lequel le sujet est mal positionné.<\/li><\/ol>\n  <div class=\"grid2\">\n    <p class=\"box\"><b>Évaluation :<\/b> Grille d'observation portant sur la diversité des plans, la lisibilité, la composition et la pertinence de l'angle.<\/p>\n    <p class=\"box liv\"><b>Livrable attendu :<\/b> Une série de cinq à huit plans correctement cadrés.<\/p>\n  <\/div>\n<\/section>\n<section class=\"seance\" id=\"s4\">\n  <h2><span class=\"n\">Séance 4<\/span>Mouvements de caméra et continuité visuelle <small>(5 heures)<\/small><\/h2>\n  <p class=\"obj\"><b>Objectif de la séance :<\/b> Réaliser des mouvements de caméra maîtrisés et assurer la cohérence entre plusieurs plans successifs.<\/p>\n  <h3>Contenus détaillés<\/h3><ul><li>Plans fixes et stabilité de l'image.<\/li><li>Panoramique horizontal et vertical.<\/li><li>Travelling et déplacement du cadreur.<\/li><li>Suivi d'un sujet en mouvement.<\/li><li>Utilisation d'un trépied ou d'un support improvisé stable.<\/li><li>Risques liés aux mouvements brusques et au zoom pendant l'enregistrement.<\/li><li>Raccord de regard, raccord de mouvement et cohérence de direction.<\/li><li>Principe de l'axe des 180 degrés dans une conversation filmée.<\/li><li>Continuité des gestes, de la position et de l'éclairage.<\/li><\/ul>\n  <h3>Activités pédagogiques<\/h3><ul><li>Démonstration de mouvements contrôlés et incontrôlés.<\/li><li>Observation d'une séquence dont les plans sont mal raccordés.<\/li><li>Travail en groupe pour préparer une courte scène avec plusieurs angles de vue.<\/li><\/ul>\n  <h3>Exercices pratiques<\/h3><ol><li>Filmer un plan fixe de 10 secondes.<\/li><li>Réaliser un panoramique lent pour révéler un espace.<\/li><li>Suivre une personne qui se déplace.<\/li><li>Filmer une action simple en trois plans : début, action et résultat.<\/li><li>Assembler les clips dans l'ordre logique et repérer les problèmes de continuité.<\/li><\/ol>\n  <div class=\"grid2\">\n    <p class=\"box\"><b>Évaluation :<\/b> Qualité de la stabilité, régularité des mouvements et cohérence de la séquence.<\/p>\n    <p class=\"box liv\"><b>Livrable attendu :<\/b> Une séquence de 30 à 45 secondes composée de plans raccordés.<\/p>\n  <\/div>\n<\/section>\n    <div class=\"pager\"><a href=\"objectifs.html\">← Objectifs<\/a><a href=\"seances-5-8.html\">Séances 5 à 8 →<\/a><\/div>\n  <\/article>\n<\/main>\n<footer class=\"foot\">\n  <div class=\"sign\">\n    <img class=\"seal-oval\" src=\"img/sceau.jpg\" alt=\"Sceau de l'école, Marc Colbert PIERRE, école de vidéographie\">\n    <div class=\"sigbox\"><img src=\"img/signature.png\" alt=\"Signature de Wadley PIERRE\"><b>WADLEY PIERRE<\/b><span>Directeur<\/span><\/div>\n  <\/div>\n  <p>Marc Colbert PIERRE · École de vidéographie — Initiation à la vidéographie · 60 heures<\/p>\n<\/footer>\n<!--@2@-->\n<!--@3@-->\n<!--@0@--><\/body>\n<\/html>\n","seances-5-8":"<!doctype html>\n<html lang=\"fr\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Séances 5 à 8<\/title>\n<meta name=\"claude:viewport-fit-sides\" content=\"cover\">\n<!--@1@-->\n<\/head>\n<body>\n<header class=\"top\">\n  <a class=\"brand\" href=\"index.html\"><img src=\"img/logo.png\" alt=\"Logo de l'établissement Marc Colbert PIERRE, école de vidéographie\"><span><b>Marc Colbert PIERRE<\/b><small>École de vidéographie<\/small><\/span><\/a>\n  <span id=\"access-chip\"><\/span>\n  <button class=\"burger\" aria-label=\"Menu\" onclick=\"document.body.classList.toggle('open')\">☰<\/button>\n  <nav><a href=\"index.html\">Accueil<\/a><a href=\"objectifs.html\">Objectifs<\/a><a href=\"seances-1-4.html\">Séances 1 à 4<\/a><a href=\"seances-5-8.html\" class=on>Séances 5 à 8<\/a><a href=\"seances-9-12.html\">Séances 9 à 12<\/a><a href=\"dictionnaire.html\">Dictionnaire<\/a><a href=\"quiz.html\">Quiz<\/a><a href=\"tutoriels.html\">Tutoriels YouTube<\/a><a href=\"evaluation.html\">Évaluation<\/a><a href=\"ethique-ressources.html\">Éthique et ressources<\/a><a href=\"certification.html\">Certification<\/a><\/nav>\n<\/header>\n<section class=\"banner\"><img src=\"img/miniature.jpg\" alt=\"Marc Colbert PIERRE, école de vidéographie : prise de vue, montage, édition, créativité\" width=\"1672\" height=\"941\"><\/section>\n<section class=\"pensee\" data-mode=\"tous\" aria-label=\"Pensées de motivation et d'inspiration\">\n  <div class=\"pensee-in\">\n    <p class=\"pensee-k\">Pensées<\/p>\n    <div class=\"pensee-tabs\" role=\"tablist\" aria-label=\"Choisir le thème des pensées\">\n      <button type=\"button\" class=\"tab\" role=\"tab\" data-cat=\"motiv\" aria-selected=\"true\">Motivation<\/button>\n      <button type=\"button\" class=\"tab\" role=\"tab\" data-cat=\"montage\" aria-selected=\"false\">Montage<\/button>\n    <\/div>\n    <div class=\"pensee-card\" id=\"pn-card\" role=\"button\" tabindex=\"0\" aria-label=\"Tourner la carte pour voir une autre pensée\">\n      <p id=\"pn-text\" class=\"pensee-t\" aria-live=\"polite\">Chargement de la pensée…<\/p>\n    <\/div>\n    <div class=\"pensee-ctl\">\n      <button type=\"button\" class=\"chip\" id=\"pn-prev\">← Précédente<\/button>\n      <button type=\"button\" class=\"chip\" id=\"pn-rand\">Au hasard<\/button>\n      <button type=\"button\" class=\"chip\" id=\"pn-next\">Suivante →<\/button>\n    <\/div>\n  <\/div>\n<\/section>\n<main class=\"wrap\">\n  <aside class=\"photo\"><img src=\"img/photo-3.jpg\" alt=\"Wadley PIERRE, directeur de l'école\" width=\"600\" loading=\"eager\"><\/aside>\n  <article>\n<h1>VI. Déroulement pédagogique détaillé<\/h1><p class=\"lead\">Séances 5 à 8<\/p>\n<section class=\"seance\" id=\"s5\">\n  <h2><span class=\"n\">Séance 5<\/span>Lumière et exposition <small>(5 heures)<\/small><\/h2>\n  <p class=\"obj\"><b>Objectif de la séance :<\/b> Contrôler l'éclairage et obtenir une image correctement exposée avec des moyens accessibles.<\/p>\n  <h3>Contenus détaillés<\/h3><ul><li>Sources de lumière naturelle et artificielle.<\/li><li>Lumière directe, diffuse, dure et douce.<\/li><li>Direction de la lumière et formation des ombres.<\/li><li>Positionnement du sujet par rapport à une fenêtre.<\/li><li>Exposition : ouverture, vitesse d'obturation et sensibilité ISO, selon les réglages accessibles.<\/li><li>Réglage de l'exposition automatique et verrouillage de l'exposition.<\/li><li>Balance des blancs et température de couleur.<\/li><li>Surexposition, sous-exposition et perte de détails.<\/li><li>Notions élémentaires d'éclairage à trois sources : principale, remplissage et contre-jour.<\/li><li>Utilisation de rideaux clairs, réflecteurs simples et lampes disponibles.<\/li><\/ul>\n  <h3>Activités pédagogiques<\/h3><ul><li>Comparaison d'un visage filmé face à une fenêtre, dos à la fenêtre et sur le côté.<\/li><li>Démonstration de la balance des blancs.<\/li><li>Analyse de vidéos trop sombres ou présentant des zones très lumineuses.<\/li><\/ul>\n  <h3>Exercices pratiques<\/h3><ol><li>Filmer un sujet dans trois conditions d'éclairage différentes.<\/li><li>Créer un éclairage simple à l'aide d'une fenêtre et d'un réflecteur improvisé.<\/li><li>Comparer l'image avec exposition automatique et exposition verrouillée.<\/li><li>Rechercher une balance des blancs cohérente.<\/li><\/ol>\n  <div class=\"grid2\">\n    <p class=\"box\"><b>Évaluation :<\/b> L'apprenant doit produire une séquence dans laquelle le sujet est correctement exposé et reste visuellement cohérent d'un plan à l'autre.<\/p>\n    <p class=\"box liv\"><b>Livrable attendu :<\/b> Trois clips comparatifs accompagnés d'une courte analyse.<\/p>\n  <\/div>\n<\/section>\n<section class=\"seance\" id=\"s6\">\n  <h2><span class=\"n\">Séance 6<\/span>Prise de son et enregistrement vocal <small>(5 heures)<\/small><\/h2>\n  <p class=\"obj\"><b>Objectif de la séance :<\/b> Enregistrer des voix et des sons d'ambiance suffisamment clairs pour être utilisés dans un montage vidéo.<\/p>\n  <h3>Contenus détaillés<\/h3><ul><li>Importance du son dans la compréhension d'une vidéo.<\/li><li>Différence entre son direct, voix off, musique et ambiance.<\/li><li>Microphone intégré, microphone-cravate et microphone externe compatible.<\/li><li>Distance entre le microphone et la personne filmée.<\/li><li>Bruits parasites : circulation, vent, ventilateurs et conversations.<\/li><li>Niveaux d'enregistrement et prévention de la saturation.<\/li><li>Écoute au casque et contrôle du son.<\/li><li>Synchronisation élémentaire de l'image et du son.<\/li><li>Respect du confort et de la vie privée des personnes enregistrées.<\/li><\/ul>\n  <h3>Activités pédagogiques<\/h3><ul><li>Écoute comparative d'enregistrements dans un environnement calme et bruyant.<\/li><li>Démonstration d'une interview avec microphone intégré, puis avec microphone externe si disponible.<\/li><li>Exercice de repérage des sources de bruit.<\/li><\/ul>\n  <h3>Exercices pratiques<\/h3><ol><li>Enregistrer une présentation de 30 secondes.<\/li><li>Enregistrer la même présentation à différentes distances.<\/li><li>Capturer trois sons d'ambiance.<\/li><li>Réaliser une interview de deux minutes avec une personne volontaire.<\/li><li>Écouter les fichiers et noter les défauts à corriger.<\/li><\/ol>\n  <div class=\"grid2\">\n    <p class=\"box\"><b>Évaluation :<\/b> Intelligibilité de la voix, maîtrise des bruits parasites, niveau sonore et qualité de l'enregistrement.<\/p>\n    <p class=\"box liv\"><b>Livrable attendu :<\/b> Une interview courte et trois fichiers de sons d'ambiance.<\/p>\n  <\/div>\n<\/section>\n<section class=\"seance\" id=\"s7\">\n  <h2><span class=\"n\">Séance 7<\/span>Préproduction : idée, scénario et plan de tournage <small>(5 heures)<\/small><\/h2>\n  <p class=\"obj\"><b>Objectif de la séance :<\/b> Préparer un tournage en définissant le sujet, le message, les scènes et les moyens nécessaires.<\/p>\n  <h3>Contenus détaillés<\/h3><ul><li>Recherche et choix d'un sujet.<\/li><li>Définition de l'objectif et du public cible.<\/li><li>Recherche documentaire et vérification des informations.<\/li><li>Synopsis, résumé et scénario.<\/li><li>Structure narrative : introduction, développement et conclusion.<\/li><li>Storyboard et liste des plans.<\/li><li>Repérage du lieu et préparation des personnes.<\/li><li>Planification du temps, du matériel et des autorisations.<\/li><li>Répartition des rôles au sein d'une équipe.<\/li><li>Liste de contrôle avant le tournage.<\/li><\/ul>\n  <h3>Activités pédagogiques<\/h3><ul><li>Analyse de scénarios simples.<\/li><li>Élaboration collective d'une idée de reportage ou de vidéo éducative.<\/li><li>Démonstration de la transformation d'une idée en liste de plans.<\/li><\/ul>\n  <h3>Exercices pratiques<\/h3><p>Chaque apprenant choisit un sujet parmi les suivants : présentation d'un établissement, portrait d'un artisan, activité musicale, reportage culturel ou capsule éducative.<\/p><p>Il prépare :<\/p><ol><li>Le titre et l'objectif de la vidéo.<\/li><li>Le public cible et le message central.<\/li><li>Un synopsis de 100 à 150 mots.<\/li><li>Un scénario ou un conducteur adapté au format choisi.<\/li><li>Un storyboard de six à huit plans.<\/li><li>Un plan de tournage et une liste du matériel nécessaire.<\/li><\/ol>\n  <div class=\"grid2\">\n    <p class=\"box\"><b>Évaluation :<\/b> Pertinence du sujet, cohérence du scénario, faisabilité du tournage et qualité de la préparation.<\/p>\n    <p class=\"box liv\"><b>Livrable attendu :<\/b> Un dossier de préproduction prêt à être utilisé.<\/p>\n  <\/div>\n<\/section>\n<section class=\"seance\" id=\"s8\">\n  <h2><span class=\"n\">Séance 8<\/span>Techniques de tournage, interview et reportage <small>(5 heures)<\/small><\/h2>\n  <p class=\"obj\"><b>Objectif de la séance :<\/b> Mettre en pratique les compétences de cadrage, de lumière et de son pour tourner une courte production structurée.<\/p>\n  <h3>Contenus détaillés<\/h3><ul><li>Installation du matériel et vérification avant enregistrement.<\/li><li>Ordre de tournage et gestion des prises.<\/li><li>Réalisation d'une interview : préparation des questions, écoute et relances.<\/li><li>Positionnement du sujet et direction du regard.<\/li><li>Plans de coupe et images d'illustration.<\/li><li>Prises de vues complémentaires.<\/li><li>Vérification du son et de la stabilité pendant le tournage.<\/li><li>Nommage des prises et sauvegarde des fichiers.<\/li><li>Communication au sein d'une équipe.<\/li><\/ul>\n  <h3>Activités pédagogiques<\/h3><ul><li>Simulation d'une interview.<\/li><li>Démonstration de la préparation d'un tournage avec smartphone.<\/li><li>Tournage en binômes ou en petits groupes.<\/li><li>Relecture immédiate des images et identification des erreurs.<\/li><\/ul>\n  <h3>Exercices pratiques<\/h3><p>Réaliser un mini-reportage de 60 à 90 secondes comprenant :<\/p><ul><li>Une séquence d'introduction.<\/li><li>Une interview.<\/li><li>Au moins quatre plans d'illustration.<\/li><li>Une conclusion ou un plan final.<\/li><li>Un enregistrement sonore intelligible.<\/li><\/ul>\n  <div class=\"grid2\">\n    <p class=\"box\"><b>Évaluation :<\/b> Respect du plan de tournage, qualité des prises, variété des plans, qualité du son et capacité à travailler en équipe.<\/p>\n    <p class=\"box liv\"><b>Livrable attendu :<\/b> Les fichiers bruts d'un mini-reportage, organisés dans un dossier.<\/p>\n  <\/div>\n<\/section>\n    <div class=\"pager\"><a href=\"seances-1-4.html\">← Séances 1 à 4<\/a><a href=\"seances-9-12.html\">Séances 9 à 12 →<\/a><\/div>\n  <\/article>\n<\/main>\n<footer class=\"foot\">\n  <div class=\"sign\">\n    <img class=\"seal-oval\" src=\"img/sceau.jpg\" alt=\"Sceau de l'école, Marc Colbert PIERRE, école de vidéographie\">\n    <div class=\"sigbox\"><img src=\"img/signature.png\" alt=\"Signature de Wadley PIERRE\"><b>WADLEY PIERRE<\/b><span>Directeur<\/span><\/div>\n  <\/div>\n  <p>Marc Colbert PIERRE · École de vidéographie — Initiation à la vidéographie · 60 heures<\/p>\n<\/footer>\n<!--@2@-->\n<!--@3@-->\n<!--@0@--><\/body>\n<\/html>\n","seances-9-12":"<!doctype html>\n<html lang=\"fr\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Séances 9 à 12<\/title>\n<meta name=\"claude:viewport-fit-sides\" content=\"cover\">\n<!--@1@-->\n<\/head>\n<body>\n<header class=\"top\">\n  <a class=\"brand\" href=\"index.html\"><img src=\"img/logo.png\" alt=\"Logo de l'établissement Marc Colbert PIERRE, école de vidéographie\"><span><b>Marc Colbert PIERRE<\/b><small>École de vidéographie<\/small><\/span><\/a>\n  <span id=\"access-chip\"><\/span>\n  <button class=\"burger\" aria-label=\"Menu\" onclick=\"document.body.classList.toggle('open')\">☰<\/button>\n  <nav><a href=\"index.html\">Accueil<\/a><a href=\"objectifs.html\">Objectifs<\/a><a href=\"seances-1-4.html\">Séances 1 à 4<\/a><a href=\"seances-5-8.html\">Séances 5 à 8<\/a><a href=\"seances-9-12.html\" class=on>Séances 9 à 12<\/a><a href=\"dictionnaire.html\">Dictionnaire<\/a><a href=\"quiz.html\">Quiz<\/a><a href=\"tutoriels.html\">Tutoriels YouTube<\/a><a href=\"evaluation.html\">Évaluation<\/a><a href=\"ethique-ressources.html\">Éthique et ressources<\/a><a href=\"certification.html\">Certification<\/a><\/nav>\n<\/header>\n<section class=\"banner\"><img src=\"img/miniature.jpg\" alt=\"Marc Colbert PIERRE, école de vidéographie : prise de vue, montage, édition, créativité\" width=\"1672\" height=\"941\"><\/section>\n<section class=\"pensee\" data-mode=\"montage\" aria-label=\"Pensées de motivation et d'inspiration\">\n  <div class=\"pensee-in\">\n    <p class=\"pensee-k\">Pensées<\/p>\n    <div class=\"pensee-tabs\" role=\"tablist\" aria-label=\"Choisir le thème des pensées\">\n      <button type=\"button\" class=\"tab\" role=\"tab\" data-cat=\"motiv\" aria-selected=\"true\">Motivation<\/button>\n      <button type=\"button\" class=\"tab\" role=\"tab\" data-cat=\"montage\" aria-selected=\"false\">Montage<\/button>\n    <\/div>\n    <div class=\"pensee-card\" id=\"pn-card\" role=\"button\" tabindex=\"0\" aria-label=\"Tourner la carte pour voir une autre pensée\">\n      <p id=\"pn-text\" class=\"pensee-t\" aria-live=\"polite\">Chargement de la pensée…<\/p>\n    <\/div>\n    <div class=\"pensee-ctl\">\n      <button type=\"button\" class=\"chip\" id=\"pn-prev\">← Précédente<\/button>\n      <button type=\"button\" class=\"chip\" id=\"pn-rand\">Au hasard<\/button>\n      <button type=\"button\" class=\"chip\" id=\"pn-next\">Suivante →<\/button>\n    <\/div>\n  <\/div>\n<\/section>\n<main class=\"wrap\">\n  <aside class=\"photo\"><img src=\"img/photo-4.jpg\" alt=\"Wadley PIERRE, directeur de l'école\" width=\"600\" loading=\"eager\"><\/aside>\n  <article>\n<h1>VI. Déroulement pédagogique détaillé<\/h1><p class=\"lead\">Séances 9 à 12<\/p>\n<section class=\"seance\" id=\"s9\">\n  <h2><span class=\"n\">Séance 9<\/span>Initiation au montage vidéo sur ordinateur <small>(5 heures)<\/small><\/h2>\n  <p class=\"obj\"><b>Objectif de la séance :<\/b> Importer, organiser et assembler des séquences vidéo dans un logiciel de montage.<\/p>\n  <h3>Contenus détaillés<\/h3><ul><li>Présentation de l'interface d'un logiciel de montage accessible aux débutants.<\/li><li>Création d'un projet et choix des paramètres.<\/li><li>Importation des fichiers vidéo et audio.<\/li><li>Organisation des médias dans des dossiers ou chutiers.<\/li><li>Découverte de la timeline.<\/li><li>Outils de sélection, découpage, déplacement et suppression.<\/li><li>Choix des meilleurs moments de chaque prise.<\/li><li>Ordre narratif et construction d'une séquence.<\/li><li>Coupes franches, transitions et raccords.<\/li><li>Sauvegarde du projet et organisation des versions.<\/li><\/ul>\n  <h3>Activités pédagogiques<\/h3><ul><li>Démonstration guidée de l'interface.<\/li><li>Montage collectif d'une séquence très courte.<\/li><li>Exercice individuel sur les rushes de la séance précédente.<\/li><\/ul>\n  <h3>Exercices pratiques<\/h3><ol><li>Créer un projet de montage.<\/li><li>Importer et classer les fichiers.<\/li><li>Sélectionner les meilleures prises.<\/li><li>Assembler au moins six plans.<\/li><li>Couper les erreurs, hésitations et moments inutiles.<\/li><li>Exporter une première version de travail.<\/li><\/ol>\n  <div class=\"grid2\">\n    <p class=\"box\"><b>Évaluation :<\/b> Organisation du projet, précision des coupes, ordre des plans et fluidité de la séquence.<\/p>\n    <p class=\"box liv\"><b>Livrable attendu :<\/b> Un premier montage de 45 à 90 secondes et le fichier de projet modifiable.<\/p>\n  <\/div>\n<\/section>\n<section class=\"seance\" id=\"s10\">\n  <h2><span class=\"n\">Séance 10<\/span>Montage avancé, titres et habillage sonore <small>(5 heures)<\/small><\/h2>\n  <p class=\"obj\"><b>Objectif de la séance :<\/b> Améliorer un montage en intégrant les éléments graphiques, sonores et visuels nécessaires à une production cohérente.<\/p>\n  <h3>Contenus détaillés<\/h3><ul><li>Révision du rythme et de la continuité narrative.<\/li><li>Ajout de titres, sous-titres et génériques.<\/li><li>Utilisation raisonnable des transitions.<\/li><li>Ajout d'une musique autorisée.<\/li><li>Insertion et réglage d'une voix off.<\/li><li>Ajustement du volume sonore et atténuation des bruits lorsque les outils le permettent.<\/li><li>Fondus d'entrée et de sortie audio.<\/li><li>Correction élémentaire de la luminosité, du contraste et des couleurs.<\/li><li>Cohérence typographique et lisibilité des textes.<\/li><li>Vérification de la synchronisation audio-vidéo.<\/li><\/ul>\n  <h3>Activités pédagogiques<\/h3><ul><li>Analyse d'un montage avant et après amélioration.<\/li><li>Démonstration de l'ajout d'une voix off et de titres.<\/li><li>Atelier de révision du projet individuel.<\/li><\/ul>\n  <h3>Exercices pratiques<\/h3><ol><li>Ajouter un titre d'ouverture.<\/li><li>Insérer des sous-titres ou des indications utiles.<\/li><li>Ajouter une musique adaptée et régler son volume.<\/li><li>Équilibrer les niveaux entre la voix et la musique.<\/li><li>Harmoniser les plans dont l'exposition diffère.<\/li><li>Produire une version révisée de la vidéo.<\/li><\/ol>\n  <div class=\"grid2\">\n    <p class=\"box\"><b>Évaluation :<\/b> Lisibilité des titres, équilibre sonore, cohérence des couleurs et respect du rythme narratif.<\/p>\n    <p class=\"box liv\"><b>Livrable attendu :<\/b> Une vidéo montée et habillée, prête pour le contrôle qualité.<\/p>\n  <\/div>\n<\/section>\n<section class=\"seance\" id=\"s11\">\n  <h2><span class=\"n\">Séance 11<\/span>Exportation, diffusion et éthique audiovisuelle <small>(5 heures)<\/small><\/h2>\n  <p class=\"obj\"><b>Objectif de la séance :<\/b> Préparer une vidéo pour sa diffusion et respecter les exigences techniques, juridiques et éthiques liées à sa publication.<\/p>\n  <h3>Contenus détaillés<\/h3><ul><li>Différence entre fichier source, fichier de projet et fichier exporté.<\/li><li>Formats de fichier, notamment MP4 et conteneur vidéo.<\/li><li>Codec vidéo et notions de compression.<\/li><li>Résolution, fréquence d'images et débit binaire.<\/li><li>Formats horizontaux, verticaux et carrés.<\/li><li>Exportation pour une lecture locale, un site web ou les réseaux sociaux.<\/li><li>Vérification du son, de l'image, des titres et des sous-titres.<\/li><li>Sauvegarde et archivage des fichiers.<\/li><li>Droits à l'image, consentement et protection de la vie privée.<\/li><li>Droits d'auteur sur la musique, les images et les autres éléments utilisés.<\/li><li>Exactitude de l'information, respect des personnes et interdiction des montages trompeurs.<\/li><li>Bonnes pratiques de publication et description d'une vidéo.<\/li><\/ul>\n  <h3>Activités pédagogiques<\/h3><ul><li>Comparaison de plusieurs fichiers exportés.<\/li><li>Analyse d'exemples de publications respectueuses ou problématiques.<\/li><li>Démonstration d'une exportation adaptée à une plateforme.<\/li><li>Vérification croisée des productions par les apprenants.<\/li><\/ul>\n  <h3>Exercices pratiques<\/h3><ol><li>Exporter une version Full HD au format MP4 si l'équipement le permet.<\/li><li>Créer une copie adaptée à un format vertical ou horizontal selon la destination.<\/li><li>Vérifier la lecture du fichier sur un autre appareil.<\/li><li>Compléter une liste de contrôle avant publication.<\/li><li>Vérifier les autorisations et les droits liés aux médias utilisés.<\/li><\/ol>\n  <div class=\"grid2\">\n    <p class=\"box\"><b>Évaluation :<\/b> Qualité du fichier exporté, respect du format choisi, contrôle qualité et conformité éthique.<\/p>\n    <p class=\"box liv\"><b>Livrable attendu :<\/b> Un fichier final de test et une fiche de vérification avant diffusion.<\/p>\n  <\/div>\n<\/section>\n<section class=\"seance\" id=\"s12\">\n  <h2><span class=\"n\">Séance 12<\/span>Réalisation, présentation et évaluation du projet final <small>(5 heures)<\/small><\/h2>\n  <p class=\"obj\"><b>Objectif de la séance :<\/b> Mobiliser les compétences acquises pour produire et présenter une vidéo autonome.<\/p>\n  <h3>Contenus détaillés<\/h3><ul><li>Rappel du cahier des charges.<\/li><li>Vérification du scénario et du plan de tournage.<\/li><li>Finalisation des prises manquantes.<\/li><li>Montage final, contrôle du son et exportation.<\/li><li>Présentation orale du projet.<\/li><li>Évaluation par le formateur et retour des pairs.<\/li><li>Autoévaluation et identification des axes de progression.<\/li><\/ul>\n  <h3>Activités pédagogiques<\/h3><ul><li>Réalisation individuelle ou en petits groupes.<\/li><li>Accompagnement technique ciblé.<\/li><li>Projection des productions.<\/li><li>Discussion collective sur les réussites et les améliorations possibles.<\/li><\/ul>\n  <h3>Exercice final<\/h3><p>Réaliser une vidéo de 2 à 3 minutes sur l'un des thèmes suivants :<\/p><ul><li>Présentation d'une école ou d'un centre de formation.<\/li><li>Portrait d'un artisan, d'un musicien ou d'un acteur communautaire.<\/li><li>Reportage sur une activité culturelle.<\/li><li>Capsule éducative.<\/li><li>Présentation d'un projet social ou communautaire.<\/li><\/ul><p>La vidéo devra comporter un début, un développement et une conclusion, des plans variés, un son intelligible et un montage cohérent.<\/p>\n  <div class=\"grid2\">\n    <p class=\"box\"><b>Évaluation :<\/b> <i>Évaluation sommative :<\/i> évaluation du produit final, de la démarche de production et de la présentation orale.<\/p>\n    <p class=\"box liv\"><b>Livrable attendu :<\/b> La vidéo finale exportée, le fichier de projet, le dossier de préproduction et une courte fiche d'autoévaluation.<\/p>\n  <\/div>\n<\/section>\n    <div class=\"pager\"><a href=\"seances-5-8.html\">← Séances 5 à 8<\/a><a href=\"dictionnaire.html\">Dictionnaire →<\/a><\/div>\n  <\/article>\n<\/main>\n<footer class=\"foot\">\n  <div class=\"sign\">\n    <img class=\"seal-oval\" src=\"img/sceau.jpg\" alt=\"Sceau de l'école, Marc Colbert PIERRE, école de vidéographie\">\n    <div class=\"sigbox\"><img src=\"img/signature.png\" alt=\"Signature de Wadley PIERRE\"><b>WADLEY PIERRE<\/b><span>Directeur<\/span><\/div>\n  <\/div>\n  <p>Marc Colbert PIERRE · École de vidéographie — Initiation à la vidéographie · 60 heures<\/p>\n<\/footer>\n<!--@2@-->\n<!--@3@-->\n<!--@0@--><\/body>\n<\/html>\n","tutoriels":"<!doctype html>\n<html lang=\"fr\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Tutoriels YouTube<\/title>\n<meta name=\"claude:viewport-fit-sides\" content=\"cover\">\n<!--@1@-->\n<\/head>\n<body>\n<header class=\"top\">\n  <a class=\"brand\" href=\"index.html\"><img src=\"img/logo.png\" alt=\"Logo de l'établissement Marc Colbert PIERRE, école de vidéographie\"><span><b>Marc Colbert PIERRE<\/b><small>École de vidéographie<\/small><\/span><\/a>\n  <span id=\"access-chip\"><\/span>\n  <button class=\"burger\" aria-label=\"Menu\" onclick=\"document.body.classList.toggle('open')\">☰<\/button>\n  <nav><a href=\"index.html\">Accueil<\/a><a href=\"objectifs.html\">Objectifs<\/a><a href=\"seances-1-4.html\">Séances 1 à 4<\/a><a href=\"seances-5-8.html\">Séances 5 à 8<\/a><a href=\"seances-9-12.html\">Séances 9 à 12<\/a><a href=\"dictionnaire.html\">Dictionnaire<\/a><a href=\"quiz.html\">Quiz<\/a><a href=\"tutoriels.html\" class=on>Tutoriels YouTube<\/a><a href=\"evaluation.html\">Évaluation<\/a><a href=\"ethique-ressources.html\">Éthique et ressources<\/a><a href=\"certification.html\">Certification<\/a><\/nav>\n<\/header>\n<section class=\"banner\"><img src=\"img/miniature.jpg\" alt=\"Marc Colbert PIERRE, école de vidéographie : prise de vue, montage, édition, créativité\" width=\"1672\" height=\"941\"><\/section>\n<section class=\"pensee\" d function show(n,hash){
  if(!PAGES[n])n='index';
  var h=PAGES[n].replace(/<!--@(\d+)@-->/g,function(m,k){return COMMON[k]}).replace(/src="(img\/[^"]+)"/g,function(m,p){return 'src="'+(ASSETS[p]||p)+'"'});
