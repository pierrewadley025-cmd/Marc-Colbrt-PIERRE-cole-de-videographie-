ue vous ne perdez pas.\", \"Les hésitations d'une interview se coupent, la sincérité se garde.\", \"Une transition simple vaut mieux qu'un effet qui détourne l'attention.\", \"Assemblez d'abord, affinez ensuite : le montage se construit par étapes.\", \"Regardez votre vidéo comme un spectateur qui la découvre.\", \"La musique accompagne la voix, elle ne doit jamais l'étouffer.\", \"Un titre lisible est un titre que l'on comprend en une seconde.\", \"Organisez vos fichiers avant de monter : un bon classement fait gagner des heures.\", \"Le silence est aussi un outil de montage.\", \"Une vidéo courte et claire vaut mieux qu'une longue vidéo qui s'égare.\", \"Chaque coupe doit servir le rythme, le sens ou l'émotion.\", \"Le premier montage n'est jamais le dernier : revenez, corrigez, améliorez.\", \"Harmonisez les couleurs de vos plans pour que le spectateur ne remarque pas les raccords.\", \"Les plans de coupe sont les meilleurs amis d'une interview.\", \"Écoutez votre montage les yeux fermés : le son doit tenir seul.\", \"Ce que vous retirez fait souvent la force de ce que vous gardez.\", \"Un raccord réussi est un raccord que personne ne remarque.\", \"Vérifiez l'exportation avant de publier : la dernière étape compte autant que la première.\", \"Le montage donne une forme à tout ce que le tournage a rassemblé.\", \"Une bonne voix off guide le regard sans le remplacer.\", \"Faites une pause, puis regardez votre montage avec des yeux neufs.\", \"La timeline est votre page blanche : chaque clip y trouve sa place dans le temps.\", \"La patience devant la timeline se voit à l'écran.\", \"Un montage clair commence par un message clair.\", \"Dix secondes justes valent mieux qu'une minute qui tourne en rond.\", \"Un fondu bien placé adoucit un changement ; un fondu de trop alourdit le récit.\", \"Gardez toujours vos rushes originaux : vous pourrez toujours recommencer.\", \"Le spectateur ne voit pas vos heures de travail, il ressent le résultat.\", \"Les premières secondes décident de la suite : soignez-les.\", \"La fin d'une vidéo doit laisser une image ou une idée à retenir.\", \"Un montage propre commence par des fichiers bien nommés.\", \"Vérifiez le niveau sonore de chaque plan : la voix doit rester stable du début à la fin.\", \"Un bon monteur est d'abord un bon spectateur.\"];\nfunction init(){\n  var sec=document.querySelector('.pensee'),card=document.getElementById('pn-card'),txt=document.getElementById('pn-text');\n  if(!sec||!card||!txt)return;\n  var tabs=[].slice.call(sec.querySelectorAll('.pensee-tabs .tab'));\n  var cat=sec.getAttribute('data-mode')==='montage'?'montage':'motiv';\n  function pool(c){return c==='montage'?M:P0;}\n  var P=pool(cat),i=Math.floor(Math.random()*P.length),busy=false;\n  var calm=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;\n  function show(){txt.textContent='\\u00ab\\u00a0'+P[i]+'\\u00a0\\u00bb';}\n  function marks(){tabs.forEach(function(t){var on=t.getAttribute('data-cat')===cat;t.classList.toggle('on',on);t.setAttribute('aria-selected',on?'true':'false');});}\n  function go(n,after){\n    if(busy)return;\n    if(after)after();\n    n=((n%P.length)+P.length)%P.length;\n    if(calm){i=n;show();return;}\n    busy=true;card.classList.add('flip');\n    setTimeout(function(){i=n;show();card.classList.remove('flip');setTimeout(function(){busy=false;},220);},200);\n  }\n  function rnd(){var n;do{n=Math.floor(Math.random()*P.length);}while(n===i&&P.length>1);return n;}\n  document.getElementById('pn-prev').addEventListener('click',function(){go(i-1);});\n  document.getElementById('pn-next').addEventListener('click',function(){go(i+1);});\n  document.getElementById('pn-rand').addEventListener('click',function(){go(rnd());});\n  tabs.forEach(function(t){t.addEventListener('click',function(){\n    var c=t.getAttribute('data-cat');if(c===cat)return;\n    cat=c;P=pool(cat);marks();go(Math.floor(Math.random()*P.length));\n  });});\n  card.addEventListener('click',function(){go(i+1);});\n  card.addEventListener('keydown',function(e){\n    if(e.key==='ArrowRight'||e.key==='Enter'||e.key===' '){e.preventDefault();go(i+1);}\n    else if(e.key==='ArrowLeft'){e.preventDefault();go(i-1);}\n  });\n  marks();show();\n}\nif(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();\n})();\n<\/script>"];

de vidéographie Marc Colbert PIERRE forme des jeunes et des adultes à produire des vidéos de qualité avec un smartphone et un ordinateur, sans expérience préalable ni équipement professionnel coûteux. Elle est dirigée par Wadley PIERRE.<\/p>\n<p>Le programme « Initiation à la vidéographie » compte 12 séances de 5 heures, soit 60 heures, et mène à la réalisation d'une vidéo de 2 à 3 minutes, du scénario à l'exportation.<\/p>\n\n<h2>Conditions d'obtention<\/h2>\n<ol><li>Suivre l'ensemble du programme de formation, soit les 12 séances.<\/li><li>Remettre les livrables attendus à la fin de chaque séance.<\/li><li>Réaliser et présenter le projet vidéo final de 2 à 3 minutes, avec le fichier de projet, le dossier de préproduction et la fiche d'autoévaluation.<\/li><li>Atteindre le seuil de réussite fixé par l'établissement sur l'évaluation sommative.<\/li><\/ol>\n<p>Le projet final est noté sur 100 points avec la grille d'évaluation de la page « Évaluation ». Les critères de réussite et le seuil d'obtention restent à fixer par l'établissement.<\/p>\n\n<h2>Calcul du résultat<\/h2>\n<p>Saisissez la note de chaque épreuve sur 100. Le total pondéré est calculé sur 100.<\/p>\n<div class=\"tw\"><table id=\"cert\"><thead><tr><th>Épreuve<\/th><th>Pondération<\/th><th>Note<\/th><\/tr><\/thead><tbody><tr><td>Connaissances théoriques et vocabulaire audiovisuel<\/td><td class=\"num\">15 %<\/td><td class=\"num\"><input type=\"number\" min=\"0\" max=\"100\" value=\"0\" data-w=\"15\" aria-label=\"Note sur 100 : Connaissances théoriques et vocabulaire audiovisuel\"> / 100<\/td><\/tr><tr><td>Exercices techniques de tournage<\/td><td class=\"num\">25 %<\/td><td class=\"num\"><input type=\"number\" min=\"0\" max=\"100\" value=\"0\" data-w=\"25\" aria-label=\"Note sur 100 : Exercices techniques de tournage\"> / 100<\/td><\/tr><tr><td>Dossier de préproduction<\/td><td class=\"num\">15 %<\/td><td class=\"num\"><input type=\"number\" min=\"0\" max=\"100\" value=\"0\" data-w=\"15\" aria-label=\"Note sur 100 : Dossier de préproduction\"> / 100<\/td><\/tr><tr><td>Projet vidéo final<\/td><td class=\"num\">35 %<\/td><td class=\"num\"><input type=\"number\" min=\"0\" max=\"100\" value=\"0\" data-w=\"35\" aria-label=\"Note sur 100 : Projet vidéo final\"> / 100<\/td><\/tr><tr><td>Présentation orale et autoévaluation<\/td><td class=\"num\">10 %<\/td><td class=\"num\"><input type=\"number\" min=\"0\" max=\"100\" value=\"0\" data-w=\"10\" aria-label=\"Note sur 100 : Présentation orale et autoévaluation\"> / 100<\/td><\/tr><\/tbody>\n<tfoot><tr><td colspan=\"2\"><b>Total pondéré<\/b><\/td><td class=\"num\"><b id=\"c-total\">0<\/b> / 100<\/td><\/tr><\/tfoot><\/table><\/div>\n<div class=\"search\"><label for=\"c-seuil\">Seuil de réussite (proposition à confirmer par la direction)<\/label>\n<input id=\"c-seuil\" type=\"number\" min=\"0\" max=\"100\" value=\"60\"><\/div>\n<p id=\"c-res\" class=\"result\">Seuil non atteint.<\/p>\n\n<h2>Modèle de certificat<\/h2>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital,wght@0,700;1,500;1,700&display=swap\">\n<p>Saisissez le nom de l'apprenant, la date et, si vous le souhaitez, sa photo pour prévisualiser le certificat.<\/p>\n<div class=\"search two\"><div><label for=\"a-nom\">Nom de l'apprenant<\/label><input id=\"a-nom\" type=\"text\" placeholder=\"Prénom NOM\" autocomplete=\"off\"><\/div>\n<div><label for=\"a-date\">Date de délivrance<\/label><input id=\"a-date\" type=\"date\"><\/div>\n<div><label for=\"a-photo\">Photo de l'apprenant<\/label><input id=\"a-photo\" type=\"file\" accept=\"image/*\"><\/div><\/div>\n<div class=\"cert-wrap\" id=\"cert-wrap\"><div class=\"cert\" id=\"cert-stage\" role=\"img\" aria-label=\"Aperçu du certificat\">\n  <svg class=\"c-bg\" viewBox=\"0 0 2000 1414\" width=\"2000\" height=\"1414\" aria-hidden=\"true\">\n    <path d=\"M0 0H610C420 90 170 330 165 700C160 1000 400 1250 690 1414H0Z\" fill=\"#f5e0c3\"/>\n    <path d=\"M0 520C50 900 330 1240 700 1414H600C300 1300 70 1100 0 850Z\" fill=\"#d1ac57\"/>\n    <path d=\"M0 640C60 960 320 1260 640 1414H540C280 1300 60 1120 0 900Z\" fill=\"#e1c581\"/>\n    <path d=\"M0 900C80 1100 280 1320 520 1414H0Z\" fill=\"#b30c0c\"/>\n    <path d=\"M0 1130C120 1250 280 1350 420 1414H0Z\" fill=\"#7a0000\"/>\n    <path d=\"M0 0H375C335 75 225 125 110 112C50 105 15 82 0 62Z\" fill=\"#e0240f\"/>\n    <path d=\"M1640 1414C1700 1320 1850 1245 2000 1245V1414Z\" fill=\"#d9200e\"/>\n    <path d=\"M1272 1414C1450 1405 1590 1300 1625 1160C1650 1040 1720 810 2000 802\" fill=\"none\" stroke=\"#e8b49a\" stroke-width=\"6\"/>\n    <path d=\"M1665 395L1725 410L1702 562L1672 526L1620 562Z\" fill=\"#b30f0f\"/>\n    <path d=\"M1815 395L1755 410L1752 562L1790 526L1840 562Z\" fill=\"#b30f0f\"/>\n  <\/svg>\n  <img class=\"c-logo\" src=\"img/logo.png\" alt=\"Logo de l'école, avec le nom complet\">\n  <div class=\"c-c c-title\">CERTIFICAT<\/div>\n  <div class=\"c-c c-sub\">d'apprentissage · Initiation à la vidéographie<\/div>\n  <div class=\"c-c c-lead\">Ce certificat est fièrement décerné à<\/div>\n  <div class=\"c-c c-namebox\"><span class=\"c-name\" id=\"a-out\">Nom de l'apprenant<\/span><\/div>\n  <div class=\"c-line\"><\/div>\n  <div class=\"c-c c-desc\">pour avoir suivi l'intégralité du programme de formation, validé les 12 séances<br>et réussi le projet final. Décerné le <span id=\"a-date-out\">……………<\/span>.<\/div>\n  <div class=\"c-medal\"><img id=\"a-photo-img\" class=\"zoom\" src=\"img/photo-7.jpg\" alt=\"Photo de l'apprenant\"><\/div>\n  <img class=\"c-seal\" src=\"img/sceau.jpg\" alt=\"Sceau de l'école, Marc Colbert PIERRE, école de vidéographie\">\n  <div class=\"c-sign\"><img src=\"img/signature.png\" alt=\"Signature de Wadley PIERRE\"><b>WADLEY PIERRE<\/b><span>Directeur<\/span><\/div>\n<\/div><\/div>\n<script>\n(function(){\n  var ins=[].slice.call(document.querySelectorAll('#cert input')),tot=document.getElementById('c-total'),seuil=document.getElementById('c-seuil'),res=document.getElementById('c-res');\n  function calc(){\n    var t=0;\n    ins.forEach(function(i){var v=parseFloat(i.value);if(isNaN(v)||v<0)v=0;if(v>100){v=100;i.value=100;}t+=v*(+i.dataset.w)/100;});\n    t=Math.round(t*10)/10;tot.textContent=t;\n    var s=parseFloat(seuil.value);if(isNaN(s))s=0;\n    res.textContent=t>=s?'Seuil atteint : le certificat peut être délivré.':'Seuil non atteint.';\n    res.classList.toggle('ok',t>=s);\n  }\n  ins.concat([seuil]).forEach(function(i){i.addEventListener('input',calc);});\n  var nom=document.getElementById('a-nom'),out=document.getElementById('a-out'),d=document.getElementById('a-date'),dout=document.getElementById('a-date-out');\n  nom.addEventListener('input',function(){out.textContent=nom.value.trim()||'Nom de l\\u2019apprenant';});\n  d.addEventListener('input',function(){\n    if(!d.value){dout.textContent='……………';return;}\n    var p=d.value.split('-');var m=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];\n    dout.textContent=(+p[2])+(+p[2]===1?'er ':' ')+m[+p[1]-1]+' '+p[0];\n  });\n  var wrap=document.getElementById('cert-wrap'),cert=document.getElementById('cert-stage');\n  function fit(){\n    var sc=wrap.clientWidth/2000;cert.style.transform='scale('+sc+')';wrap.style.height=(1414*sc)+'px';\n    var sz=150;out.style.fontSize=sz+'px';\n    while(out.scrollWidth>1090&&sz>50){sz-=6;out.style.fontSize=sz+'px';}\n  }\n  nom.addEventListener('input',fit);\n  window.addEventListener('resize',fit);\n  if(window.ResizeObserver){new ResizeObserver(fit).observe(wrap);}\n  var ph=document.getElementById('a-photo'),pimg=document.getElementById('a-photo-img');\n  ph.addEventListener('change',function(){\n    var f=ph.files&&ph.files[0];if(!f)return;\n    var r=new FileReader();r.onload=function(){pimg.classList.remove('zoom');pimg.src=r.result;};r.readAsDataURL(f);\n  });\n  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fit);\n  fit();\n  calc();\n})();\n<\/script>\n\n<\/div>\n    <div class=\"pager\"><a href=\"ethique-ressources.html\">← Éthique et ressources<\/a><span><\/span><\/div>\n  <\/article>\n<\/main>\n<footer class=\"foot\">\n  <div class=\"sign\">\n    <img class=\"seal-oval\" src=\"img/sceau.jpg\" alt=\"Sceau de l'école, Marc Colbert PIERRE, école de vidéographie\">\n    <div class=\"sigbox\"><img src=\"img/signature.png\" alt=\"Signature de Wadley PIERRE\"><b>WADLEY PIERRE<\/b><span>Directeur<\/span><\/div>\n  <\/div>\n  <p>Marc Colbert PIERRE · École de vidéographie — Initiation à la vidéographie · 60 heures<\/p>\n<\/footer>\n<!--@2@-->\n<!--@3@-->\n<!--@0@--><\/body>\n<\/html>\n","dictionnaire":"<!doctype html>\n<html lang=\"fr\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Dictionnaire<\/title>\n<meta name=\"claude:viewport-fit-sides\" content=\"cover\">\n<!--@1@-->\n<\/head>\n<body>\n<header class=\"top\">\n  <a class=\"brand\" href=\"index.html\"><img src=\"img/logo.png\" alt=\"Logo de l'établissement Marc Colbert PIERRE, école de vidéographie\"><span><b>Marc Colbert PIERRE<\/b><small>École de vidéographie<\/small><\/span><\/a>\n  <span id=\"access-chip\"><\/span>\n  <button class=\"burger\" aria-label=\"Menu\" onclick=\"document.body.classList.toggle('open')\">☰<\/button>\n  <nav><a href=\"index.html\">Accueil<\/a><a href=\"objectifs.html\">Objectifs<\/a><a href=\"seances-1-4.html\">Séances 1 à 4<\/a><a href=\"seances-5-8.html\">Séances 5 à 8<\/a><a href=\"seances-9-12.html\">Séances 9 à 12<\/a><a href=\"dictionnaire.html\" class=on>Dictionnaire<\/a><a href=\"quiz.html\">Quiz<\/a><a href=\"tutoriels.html\">Tutoriels YouTube<\/a><a href=\"evaluation.html\">Évaluation<\/a><a href=\"ethique-ressources.html\">Éthique et ressources<\/a><a href=\"certification.html\">Certification<\/a><\/nav>\n<\/header>\n<section class=\"banner\"><img src=\"img/miniature.jpg\" alt=\"Marc Colbert PIERRE, école de vidéographie : prise de vue, montage, édition, créativité\" width=\"1672\" height=\"941\"><\/section>\n<section class=\"pensee\" data-mode=\"tous\" aria-label=\"Pensées de motivation et d'inspiration\">\n  <div class=\"pensee-in\">\n    <p class=\"pensee-k\">Pensées<\/p>\n    <div class=\"pensee-tabs\" role=\"tablist\" aria-label=\"Choisir le thème des pensées\">\n      <button type=\"button\" class=\"tab\" role=\"tab\" data-cat=\"motiv\" aria-selected=\"true\">Motivation<\/button>\n      <button type=\"button\" class=\"tab\" role=\"tab\" data-cat=\"montage\" aria-selected=\"false\">Montage<\/button>\n    <\/div>\n    <div class=\"pensee-card\" id=\"pn-card\" role=\"button\" tabindex=\"0\" aria-label=\"Tourner la carte pour voir une autre pensée\">\n      <p id=\"pn-text\" class=\"pensee-t\" aria-live=\"polite\">Chargement de la pensée…<\/p>\n    <\/div>\n    <div class=\"pensee-ctl\">\n      <button type=\"button\" class=\"chip\" id=\"pn-prev\">← Précédente<\/button>\n      <button type=\"button\" class=\"chip\" id=\"pn-rand\">Au hasard<\/button>\n      <button type=\"button\" class=\"chip\" id=\"pn-next\">Suivante →<\/button>\n    <\/div>\n  <\/div>\n<\/section>\n<main class=\"wrap\">\n  <aside class=\"photo\"><img src=\"img/photo-5.jpg\" alt=\"Wadley PIERRE, directeur de l'école\" width=\"600\" loading=\"eager\"><\/aside>\n  <article>\n\n<p class=\"kicker\">Dictionnaire pédagogique<\/p>\n<h1>Dictionnaire de vidéographie<\/h1>\n<p class=\"lead\">142 concepts classés par module, avec des définitions claires, et un petit glossaire complémentaire.<\/p>\n<p>Formation : Initiation à la vidéographie, niveau débutant, 60 heures.<\/p>\n<div class=\"search\"><label for=\"dict-q\">Chercher un terme<\/label>\n<input id=\"dict-q\" type=\"search\" placeholder=\"Exemple : cadrage, timeline, codec\" autocomplete=\"off\">\n<span id=\"dict-n\" class=\"muted\">142 termes affichés<\/span><\/div>\n<nav class=\"toc\" aria-label=\"Modules du dictionnaire\"><a href=\"#m1\">1. Fondements de la vidéographie<\/a><a href=\"#m2\">2. Smartphone et réglages de prise de vue<\/a><a href=\"#m3\">3. Cadrage et composition de l'image<\/a><a href=\"#m4\">4. Mouvements de caméra et continuité visuelle<\/a><a href=\"#m5\">5. Lumière et exposition<\/a><a href=\"#m6\">6. Prise de son et enregistrement vocal<\/a><a href=\"#m7\">7. Préproduction et écriture audiovisuelle<\/a><a href=\"#m8\">8. Tournage, interview et reportage<\/a><a href=\"#m9\">9. Initiation au montage vidéo<\/a><a href=\"#m10\">10. Habillage sonore et graphique<\/a><a href=\"#m11\">11. Exportation, diffusion et éthique<\/a><a href=\"#m12\">12. Projet final et évaluation<\/a><a href=\"#glossaire\">Glossaire complémentaire<\/a><\/nav>\n<section class=\"mod\" id=\"m1\"><h2>Module 1 — Fondements de la vidéographie<\/h2><p class=\"obj\"><b>Objectif :<\/b> comprendre le vocabulaire fondamental de la production audiovisuelle.<\/p><dl><div class=\"term\" data-s=\"vidéographie la vidéographie est l&#x27;ensemble des techniques et des pratiques permettant de concevoir, filmer, enregistrer et produire des vidéos à des fins informatives, éducatives, artistiques, commerciales ou de divertissement.\"><dt><span class=\"tn\">1<\/span>Vidéographie<\/dt><dd>La vidéographie est l'ensemble des techniques et des pratiques permettant de concevoir, filmer, enregistrer et produire des vidéos à des fins informatives, éducatives, artistiques, commerciales ou de divertissement.<\/dd><\/div><div class=\"term\" data-s=\"audiovisuel l&#x27;audiovisuel désigne les moyens de communication qui associent des images et des sons pour transmettre un message ou raconter une histoire.\"><dt><span class=\"tn\">2<\/span>Audiovisuel<\/dt><dd>L'audiovisuel désigne les moyens de communication qui associent des images et des sons pour transmettre un message ou raconter une histoire.<\/dd><\/div><div class=\"term\" data-s=\"vidéo une vidéo est une succession d&#x27;images affichées à une certaine fréquence, généralement accompagnées de son, qui donne l&#x27;impression d&#x27;un mouvement.\"><dt><span class=\"tn\">3<\/span>Vidéo<\/dt><dd>Une vidéo est une succession d'images affichées à une certaine fréquence, généralement accompagnées de son, qui donne l'impression d'un mouvement.<\/dd><\/div><div class=\"term\" data-s=\"photographie la photographie est une technique permettant de fixer une image sur un support numérique ou physique. contrairement à la vidéo, elle représente généralement un instant isolé.\"><dt><span class=\"tn\">4<\/span>Photographie<\/dt><dd>La photographie est une technique permettant de fixer une image sur un support numérique ou physique. Contrairement à la vidéo, elle représente généralement un instant isolé.<\/dd><\/div><div class=\"term\" data-s=\"cinématographie la cinématographie est l&#x27;art et la technique de créer des images animées en contrôlant notamment le cadrage, la lumière, les mouvements de caméra, les couleurs et l&#x27;exposition.\"><dt><span class=\"tn\">5<\/span>Cinématographie<\/dt><dd>La cinématographie est l'art et la technique de créer des images animées en contrôlant notamment le cadrage, la lumière, les mouvements de caméra, les couleurs et l'exposition.<\/dd><\/div><div class=\"term\" data-s=\"production audiovisuelle la production audiovisuelle est le processus qui permet de transformer une idée en un contenu final destiné à être visionné ou diffusé.\"><dt><span class=\"tn\">6<\/span>Production audiovisuelle<\/dt><dd>La production audiovisuelle est le processus qui permet de transformer une idée en un contenu final destiné à être visionné ou diffusé.<\/dd><\/div><div class=\"term\" data-s=\"préproduction la préproduction est la phase de préparation d&#x27;un projet vidéo. elle comprend la recherche du sujet, l&#x27;écriture du scénario, le choix des lieux, la préparation du matériel et l&#x27;organisation du tournage.\"><dt><span class=\"tn\">7<\/span>Préproduction<\/dt><dd>La préproduction est la phase de préparation d'un projet vidéo. Elle comprend la recherche du sujet, l'écriture du scénario, le choix des lieux, la préparation du matériel et l'organisation du tournage.<\/dd><\/div><div class=\"term\" data-s=\"production la production est la phase pendant laquelle les images et les sons sont enregistrés conformément au projet préparé.\"><dt><span class=\"tn\">8<\/span>Production<\/dt><dd>La production est la phase pendant laquelle les images et les sons sont enregistrés conformément au projet préparé.<\/dd><\/div><div class=\"term\" data-s=\"postproduction la postproduction regroupe les opérations effectuées après le tournage : montage, traitement du son, correction des couleurs, ajout de titres et exportation.\"><dt><span class=\"tn\">9<\/span>Postproduction<\/dt><dd>La postproduction regroupe les opérations effectuées après le tournage : montage, traitement du son, correction des couleurs, ajout de titres et exportation.<\/dd><\/div><div class=\"term\" data-s=\"plan un plan est une séquence d&#x27;images enregistrées de manière continue entre le début et la fin d&#x27;une prise, sans coupure au montage.\"><dt><span class=\"tn\">10<\/span>Plan<\/dt><dd>Un plan est une séquence d'images enregistrées de manière continue entre le début et la fin d'une prise, sans coupure au montage.<\/dd><\/div><div class=\"term\" data-s=\"séquence une séquence est un ensemble de plans organisés pour représenter une action, un événement ou une partie cohérente d&#x27;un récit.\"><dt><span class=\"tn\">11<\/span>Séquence<\/dt><dd>Une séquence est un ensemble de plans organisés pour représenter une action, un événement ou une partie cohérente d'un récit.<\/dd><\/div><div class=\"term\" data-s=\"scène une scène représente une action ou un événement qui se déroule généralement dans un même lieu et dans une continuité temporelle.\"><dt><span class=\"tn\">12<\/span>Scène<\/dt><dd>Une scène représente une action ou un événement qui se déroule généralement dans un même lieu et dans une continuité temporelle.<\/dd><\/div><div class=\"term\" data-s=\"rushes les rushes sont les fichiers vidéo et audio originaux enregistrés pendant le tournage, avant leur sélection et leur montage.\"><dt><span class=\"tn\">13<\/span>Rushes<\/dt><dd>Les rushes sont les fichiers vidéo et audio originaux enregistrés pendant le tournage, avant leur sélection et leur montage.<\/dd><\/div><div class=\"term\" data-s=\"réalisation la réalisation consiste à diriger les choix artistiques et techniques nécessaires pour transformer un scénario ou une idée en production audiovisuelle.\"><dt><span class=\"tn\">14<\/span>Réalisation<\/dt><dd>La réalisation consiste à diriger les choix artistiques et techniques nécessaires pour transformer un scénario ou une idée en production audiovisuelle.<\/dd><\/div><div class=\"term\" data-s=\"cadreur le cadreur est la personne qui prépare et contrôle le cadrage et les mouvements de la caméra pendant le tournage.\"><dt><span class=\"tn\">15<\/span>Cadreur<\/dt><dd>Le cadreur est la personne qui prépare et contrôle le cadrage et les mouvements de la caméra pendant le tournage.<\/dd><\/div><\/dl><\/section><section class=\"mod\" id=\"m2\"><h2>Module 2 — Smartphone et réglages de prise de vue<\/h2><dl><div class=\"term\" data-s=\"smartphone un smartphone est un téléphone mobile doté de fonctions informatiques et multimédias, notamment la capture vidéo, l&#x27;enregistrement sonore et le traitement des images.\"><dt><span class=\"tn\">16<\/span>Smartphone<\/dt><dd>Un smartphone est un téléphone mobile doté de fonctions informatiques et multimédias, notamment la capture vidéo, l'enregistrement sonore et le traitement des images.<\/dd><\/div><div class=\"term\" data-s=\"capteur d&#x27;image le capteur d&#x27;image est le composant électronique qui transforme la lumière reçue par l&#x27;objectif en données numériques permettant de produire une image.\"><dt><span class=\"tn\">17<\/span>Capteur d'image<\/dt><dd>Le capteur d'image est le composant électronique qui transforme la lumière reçue par l'objectif en données numériques permettant de produire une image.<\/dd><\/div><div class=\"term\" data-s=\"objectif l&#x27;objectif est le système optique qui dirige la lumière vers le capteur. il influence notamment l&#x27;angle de vue, la perspective et le rendu de l&#x27;image.\"><dt><span class=\"tn\">18<\/span>Objectif<\/dt><dd>L'objectif est le système optique qui dirige la lumière vers le capteur. Il influence notamment l'angle de vue, la perspective et le rendu de l'image.<\/dd><\/div><div class=\"term\" data-s=\"résolution la résolution indique le nombre de pixels composant une image vidéo. une résolution plus élevée permet généralement de représenter davantage de détails, si les autres conditions de prise de vue sont satisfaisantes.\"><dt><span class=\"tn\">19<\/span>Résolution<\/dt><dd>La résolution indique le nombre de pixels composant une image vidéo. Une résolution plus élevée permet généralement de représenter davantage de détails, si les autres conditions de prise de vue sont satisfaisantes.<\/dd><\/div><div class=\"term\" data-s=\"pixel un pixel est la plus petite unité élémentaire d&#x27;une image numérique. un ensemble de pixels forme l&#x27;image affichée sur un écran.\"><dt><span class=\"tn\">20<\/span>Pixel<\/dt><dd>Un pixel est la plus petite unité élémentaire d'une image numérique. Un ensemble de pixels forme l'image affichée sur un écran.<\/dd><\/div><div class=\"term\" data-s=\"hd, full hd et 4k ces appellations désignent des catégories de résolution vidéo. la hd correspond généralement à 1280 × 720 pixels, la full hd à 1920 × 1080 pixels et l&#x27;uhd 4k à 3840 × 2160 pixels.\"><dt><span class=\"tn\">21<\/span>HD, Full HD et 4K<\/dt><dd>Ces appellations désignent des catégories de résolution vidéo. La HD correspond généralement à 1280 × 720 pixels, la Full HD à 1920 × 1080 pixels et l'UHD 4K à 3840 × 2160 pixels.<\/dd><\/div><div class=\"term\" data-s=\"fréquence d&#x27;images (fps) la fréquence d&#x27;images indique le nombre d&#x27;images enregistrées ou affichées chaque seconde. elle s&#x27;exprime en images par seconde, ou fps.\"><dt><span class=\"tn\">22<\/span>Fréquence d'images (FPS)<\/dt><dd>La fréquence d'images indique le nombre d'images enregistrées ou affichées chaque seconde. Elle s'exprime en images par seconde, ou FPS.<\/dd><\/div><div class=\"term\" data-s=\"format horizontal le format horizontal est une orientation dans laquelle la largeur de l&#x27;image est supérieure à sa hauteur. il est notamment utilisé pour les films, les interviews et les vidéos destinées aux écrans larges.\"><dt><span class=\"tn\">23<\/span>Format horizontal<\/dt><dd>Le format horizontal est une orientation dans laquelle la largeur de l'image est supérieure à sa hauteur. Il est notamment utilisé pour les films, les interviews et les vidéos destinées aux écrans larges.<\/dd><\/div><div class=\"term\" data-s=\"format vertical le format vertical est une orientation dans laquelle la hauteur de l&#x27;image est supérieure à sa largeur. il est fréquemment utilisé pour les vidéos mobiles et les contenus courts des réseaux sociaux.\"><dt><span class=\"tn\">24<\/span>Format vertical<\/dt><dd>Le format vertical est une orientation dans laquelle la hauteur de l'image est supérieure à sa largeur. Il est fréquemment utilisé pour les vidéos mobiles et les contenus courts des réseaux sociaux.<\/dd><\/div><div class=\"term\" data-s=\"mise au point la mise au point est le réglage qui permet de rendre net le sujet ou la zone de l&#x27;image que l&#x27;on souhaite montrer avec précision.\"><dt><span class=\"tn\">25<\/span>Mise au point<\/dt><dd>La mise au point est le réglage qui permet de rendre net le sujet ou la zone de l'image que l'on souhaite montrer avec précision.<\/dd><\/div><div class=\"term\" data-s=\"autofocus l&#x27;autofocus est un système qui ajuste automatiquement la mise au point afin de maintenir un sujet net.\"><dt><span class=\"tn\">26<\/span>Autofocus<\/dt><dd>L'autofocus est un système qui ajuste automatiquement la mise au point afin de maintenir un sujet net.<\/dd><\/div><div class=\"term\" data-s=\"zoom optique le zoom optique modifie la focale d&#x27;un objectif pour rapprocher visuellement le sujet sans simplement agrandir les pixels de l&#x27;image.\"><dt><span class=\"tn\">27<\/span>Zoom optique<\/dt><dd>Le zoom optique modifie la focale d'un objectif pour rapprocher visuellement le sujet sans simplement agrandir les pixels de l'image.<\/dd><\/div><div class=\"term\" data-s=\"zoom numérique le zoom numérique agrandit une partie de l&#x27;image par traitement électronique. il peut entraîner une perte de détails.\"><dt><span class=\"tn\">28<\/span>Zoom numérique<\/dt><dd>Le zoom numérique agrandit une partie de l'image par traitement électronique. Il peut entraîner une perte de détails.<\/dd><\/div><div class=\"term\" data-s=\"balance des blancs la balance des blancs est le réglage qui permet de reproduire les couleurs de manière cohérente selon la couleur de la lumière ambiante.\"><dt><span class=\"tn\">29<\/span>Balance des blancs<\/dt><dd>La balance des blancs est le réglage qui permet de reproduire les couleurs de manière cohérente selon la couleur de la lumière ambiante.<\/dd><\/div><div class=\"term\" data-s=\"stabilisation la stabilisation est l&#x27;ensemble des procédés optiques, électroniques ou mécaniques destinés à réduire les tremblements et les mouvements involontaires de l&#x27;image.\"><dt><span class=\"tn\">30<\/span>Stabilisation<\/dt><dd>La stabilisation est l'ensemble des procédés optiques, électroniques ou mécaniques destinés à réduire les tremblements et les mouvements involontaires de l'image.<\/dd><\/div><\/dl><\/section><section class=\"mod\" id=\"m3\"><h2>Module 3 — Cadrage et composition de l'image<\/h2><dl><div class=\"term\" data-s=\"cadrage le cadrage est le choix de ce qui apparaît dans les limites de l&#x27;image et de la manière dont les éléments sont disposés dans le cadre.\"><dt><span class=\"tn\">31<\/span>Cadrage<\/dt><dd>Le cadrage est le choix de ce qui apparaît dans les limites de l'image et de la manière dont les éléments sont disposés dans le cadre.<\/dd><\/div><div class=\"term\" data-s=\"cadre le cadre est la limite rectangulaire de l&#x27;image enregistrée ou affichée. il détermine ce que le spectateur voit et ce qui reste hors champ.\"><dt><span class=\"tn\">32<\/span>Cadre<\/dt><dd>Le cadre est la limite rectangulaire de l'image enregistrée ou affichée. Il détermine ce que le spectateur voit et ce qui reste hors champ.<\/dd><\/div><div class=\"term\" data-s=\"champ le champ est la partie de l&#x27;espace visible dans l&#x27;image à travers l&#x27;objectif de la caméra.\"><dt><span class=\"tn\">33<\/span>Champ<\/dt><dd>Le champ est la partie de l'espace visible dans l'image à travers l'objectif de la caméra.<\/dd><\/div><div class=\"term\" data-s=\"hors-champ le hors-champ désigne les éléments situés en dehors des limites de l&#x27;image, mais qui peuvent être suggérés par le son, le regard ou l&#x27;action.\"><dt><span class=\"tn\">34<\/span>Hors-champ<\/dt><dd>Le hors-champ désigne les éléments situés en dehors des limites de l'image, mais qui peuvent être suggérés par le son, le regard ou l'action.<\/dd><\/div><div class=\"term\" data-s=\"plan général le plan général montre un espace étendu et situe les personnages ou les objets dans leur environnement.\"><dt><span class=\"tn\">35<\/span>Plan général<\/dt><dd>Le plan général montre un espace étendu et situe les personnages ou les objets dans leur environnement.<\/dd><\/div><div class=\"term\" data-s=\"plan d&#x27;ensemble le plan d&#x27;ensemble présente un lieu ou un groupe dans sa globalité, tout en permettant d&#x27;identifier les éléments importants de la scène.\"><dt><span class=\"tn\">36<\/span>Plan d'ensemble<\/dt><dd>Le plan d'ensemble présente un lieu ou un groupe dans sa globalité, tout en permettant d'identifier les éléments importants de la scène.<\/dd><\/div><div class=\"term\" data-s=\"plan moyen le plan moyen montre généralement un personnage en pied, ce qui permet d&#x27;observer sa posture et ses actions.\"><dt><span class=\"tn\">37<\/span>Plan moyen<\/dt><dd>Le plan moyen montre généralement un personnage en pied, ce qui permet d'observer sa posture et ses actions.<\/dd><\/div><div class=\"term\" data-s=\"plan américain le plan américain cadre habituellement le personnage à mi-cuisse ou à hauteur des cuisses.\"><dt><span class=\"tn\">38<\/span>Plan américain<\/dt><dd>Le plan américain cadre habituellement le personnage à mi-cuisse ou à hauteur des cuisses.<\/dd><\/div><div class=\"term\" data-s=\"plan rapproché le plan rapproché montre le personnage à partir de la poitrine ou de la taille, selon le cadrage recherché.\"><dt><span class=\"tn\">39<\/span>Plan rapproché<\/dt><dd>Le plan rapproché montre le personnage à partir de la poitrine ou de la taille, selon le cadrage recherché.<\/dd><\/div><div class=\"term\" data-s=\"gros plan le gros plan met en évidence le visage ou une partie importante du sujet pour attirer l&#x27;attention sur une expression ou un détail.\"><dt><span class=\"tn\">40<\/span>Gros plan<\/dt><dd>Le gros plan met en évidence le visage ou une partie importante du sujet pour attirer l'attention sur une expression ou un détail.<\/dd><\/div><div class=\"term\" data-s=\"très gros plan le très gros plan isole un détail très précis, comme un œil, une main ou un petit objet.\"><dt><span class=\"tn\">41<\/span>Très gros plan<\/dt><dd>Le très gros plan isole un détail très précis, comme un œil, une main ou un petit objet.<\/dd><\/div><div class=\"term\" data-s=\"angle de prise de vue l&#x27;angle de prise de vue est la position de la caméra par rapport au sujet, en particulier selon sa hauteur et son orientation.\"><dt><span class=\"tn\">42<\/span>Angle de prise de vue<\/dt><dd>L'angle de prise de vue est la position de la caméra par rapport au sujet, en particulier selon sa hauteur et son orientation.<\/dd><\/div><div class=\"term\" data-s=\"plongée la plongée est un angle de prise de vue dans lequel la caméra regarde le sujet depuis une position plus élevée.\"><dt><span class=\"tn\">43<\/span>Plongée<\/dt><dd>La plongée est un angle de prise de vue dans lequel la caméra regarde le sujet depuis une position plus élevée.<\/dd><\/div><div class=\"term\" data-s=\"contre-plongée la contre-plongée est un angle de prise de vue dans lequel la caméra regarde le sujet depuis une position plus basse.\"><dt><span class=\"tn\">44<\/span>Contre-plongée<\/dt><dd>La contre-plongée est un angle de prise de vue dans lequel la caméra regarde le sujet depuis une position plus basse.<\/dd><\/div><div class=\"term\" data-s=\"règle des tiers la règle des tiers consiste à diviser mentalement l&#x27;image en neuf parties égales à l&#x27;aide de deux lignes horizontales et de deux lignes verticales, puis à placer certains éléments importants sur ces lignes ou à leurs intersections.\"><dt><span class=\"tn\">45<\/span>Règle des tiers<\/dt><dd>La règle des tiers consiste à diviser mentalement l'image en neuf parties égales à l'aide de deux lignes horizontales et de deux lignes verticales, puis à placer certains éléments importants sur ces lignes ou à leurs intersections.<\/dd><\/div><div class=\"term\" data-s=\"composition de l&#x27;image la composition est l&#x27;organisation des sujets, des formes, des lignes, des couleurs et des espaces à l&#x27;intérieur du cadre.\"><dt><span class=\"tn\">46<\/span>Composition de l'image<\/dt><dd>La composition est l'organisation des sujets, des formes, des lignes, des couleurs et des espaces à l'intérieur du cadre.<\/dd><\/div><div class=\"term\" data-s=\"profondeur de champ la profondeur de champ est la zone de l&#x27;espace qui paraît suffisamment nette devant et derrière le point de mise au point.\"><dt><span class=\"tn\">47<\/span>Profondeur de champ<\/dt><dd>La profondeur de champ est la zone de l'espace qui paraît suffisamment nette devant et derrière le point de mise au point.<\/dd><\/div><div class=\"term\" data-s=\"arrière-plan l&#x27;arrière-plan est la partie de l&#x27;image située derrière le sujet principal. il contribue à situer le sujet et peut renforcer ou distraire l&#x27;attention.\"><dt><span class=\"tn\">48<\/span>Arrière-plan<\/dt><dd>L'arrière-plan est la partie de l'image située derrière le sujet principal. Il contribue à situer le sujet et peut renforcer ou distraire l'attention.<\/dd><\/div><\/dl><\/section><section class=\"mod\" id=\"m4\"><h2>Module 4 — Mouvements de caméra et continuité visuelle<\/h2><dl><div class=\"term\" data-s=\"plan fixe un plan fixe est une prise de vue dans laquelle la caméra reste immobile pendant l&#x27;enregistrement.\"><dt><span class=\"tn\">49<\/span>Plan fixe<\/dt><dd>Un plan fixe est une prise de vue dans laquelle la caméra reste immobile pendant l'enregistrement.<\/dd><\/div><div class=\"term\" data-s=\"panoramique le panoramique est un mouvement de rotation de la caméra sur un axe fixe, horizontalement ou verticalement.\"><dt><span class=\"tn\">50<\/span>Panoramique<\/dt><dd>Le panoramique est un mouvement de rotation de la caméra sur un axe fixe, horizontalement ou verticalement.<\/dd><\/div><div class=\"term\" data-s=\"travelling le travelling est un mouvement de caméra qui se déplace physiquement dans l&#x27;espace, par exemple en avançant, en reculant ou en se déplaçant latéralement.\"><dt><span class=\"tn\">51<\/span>Travelling<\/dt><dd>Le travelling est un mouvement de caméra qui se déplace physiquement dans l'espace, par exemple en avançant, en reculant ou en se déplaçant latéralement.<\/dd><\/div><div class=\"term\" data-s=\"plan de suivi le plan de suivi est une prise de vue dans laquelle la caméra accompagne le déplacement d&#x27;un personnage ou d&#x27;un objet.\"><dt><span class=\"tn\">52<\/span>Plan de suivi<\/dt><dd>Le plan de suivi est une prise de vue dans laquelle la caméra accompagne le déplacement d'un personnage ou d'un objet.<\/dd><\/div><div class=\"term\" data-s=\"trépied le trépied est un support à trois pieds permettant de stabiliser une caméra ou un smartphone.\"><dt><span class=\"tn\">53<\/span>Trépied<\/dt><dd>Le trépied est un support à trois pieds permettant de stabiliser une caméra ou un smartphone.<\/dd><\/div><div class=\"term\" data-s=\"stabilisateur un stabilisateur est un dispositif mécanique ou électronique qui limite les mouvements indésirables pendant la prise de vue.\"><dt><span class=\"tn\">54<\/span>Stabilisateur<\/dt><dd>Un stabilisateur est un dispositif mécanique ou électronique qui limite les mouvements indésirables pendant la prise de vue.<\/dd><\/div><div class=\"term\" data-s=\"continuité visuelle la continuité visuelle désigne la cohérence entre les plans successifs concernant notamment la position des personnages, les gestes, la direction des déplacements et la lumière.\"><dt><span class=\"tn\">55<\/span>Continuité visuelle<\/dt><dd>La continuité visuelle désigne la cohérence entre les plans successifs concernant notamment la position des personnages, les gestes, la direction des déplacements et la lumière.<\/dd><\/div><div class=\"term\" data-s=\"raccord un raccord est un lien visuel ou sonore entre deux plans qui permet de maintenir une continuité compréhensible au montage.\"><dt><span class=\"tn\">56<\/span>Raccord<\/dt><dd>Un raccord est un lien visuel ou sonore entre deux plans qui permet de maintenir une continuité compréhensible au montage.<\/dd><\/div><div class=\"term\" data-s=\"raccord de regard le raccord de regard consiste à enchaîner le regard d&#x27;un personnage avec un plan montrant ce qu&#x27;il regarde.\"><dt><span class=\"tn\">57<\/span>Raccord de regard<\/dt><dd>Le raccord de regard consiste à enchaîner le regard d'un personnage avec un plan montrant ce qu'il regarde.<\/dd><\/div><div class=\"term\" data-s=\"axe des 180 degrés l&#x27;axe des 180 degrés est une règle de mise en scène qui aide à maintenir la cohérence de la position relative des personnages et de leurs directions à l&#x27;écran lors d&#x27;une conversation ou d&#x27;une action.\"><dt><span class=\"tn\">58<\/span>Axe des 180 degrés<\/dt><dd>L'axe des 180 degrés est une règle de mise en scène qui aide à maintenir la cohérence de la position relative des personnages et de leurs directions à l'écran lors d'une conversation ou d'une action.<\/dd><\/div><div class=\"term\" data-s=\"plan de coupe un plan de coupe est un plan complémentaire inséré dans une séquence principale pour illustrer une action, apporter un détail ou faciliter le montage.\"><dt><span class=\"tn\">59<\/span>Plan de coupe<\/dt><dd>Un plan de coupe est un plan complémentaire inséré dans une séquence principale pour illustrer une action, apporter un détail ou faciliter le montage.<\/dd><\/div><\/dl><\/section><section class=\"mod\" id=\"m5\"><h2>Module 5 — Lumière et exposition<\/h2><dl><div class=\"term\" data-s=\"lumière naturelle la lumière naturelle est la lumière provenant de sources naturelles, notamment le soleil et la lumière du ciel.\"><dt><span class=\"tn\">60<\/span>Lumière naturelle<\/dt><dd>La lumière naturelle est la lumière provenant de sources naturelles, notamment le soleil et la lumière du ciel.<\/dd><\/div><div class=\"term\" data-s=\"lumière artificielle la lumière artificielle est produite par des sources créées par l&#x27;être humain, telles que les lampes, les panneaux led et les projecteurs.\"><dt><span class=\"tn\">61<\/span>Lumière artificielle<\/dt><dd>La lumière artificielle est produite par des sources créées par l'être humain, telles que les lampes, les panneaux LED et les projecteurs.<\/dd><\/div><div class=\"term\" data-s=\"lumière dure la lumière dure produit des ombres marquées et des transitions nettes entre les zones éclairées et les zones sombres.\"><dt><span class=\"tn\">62<\/span>Lumière dure<\/dt><dd>La lumière dure produit des ombres marquées et des transitions nettes entre les zones éclairées et les zones sombres.<\/dd><\/div><div class=\"term\" data-s=\"lumière douce la lumière douce produit généralement des ombres moins marquées et des transitions plus progressives.\"><dt><span class=\"tn\">63<\/span>Lumière douce<\/dt><dd>La lumière douce produit généralement des ombres moins marquées et des transitions plus progressives.<\/dd><\/div><div class=\"term\" data-s=\"exposition l&#x27;exposition correspond à la quantité de lumière enregistrée par le capteur pour former une image. une exposition adaptée permet de conserver les détails utiles dans les zones claires et sombres.\"><dt><span class=\"tn\">64<\/span>Exposition<\/dt><dd>L'exposition correspond à la quantité de lumière enregistrée par le capteur pour former une image. Une exposition adaptée permet de conserver les détails utiles dans les zones claires et sombres.<\/dd><\/div><div class=\"term\" data-s=\"ouverture l&#x27;ouverture est le diamètre effectif du diaphragme de l&#x27;objectif qui laisse entrer la lumière. elle s&#x27;exprime généralement par un nombre f, tel que f/2.8 ou f/5.6.\"><dt><span class=\"tn\">65<\/span>Ouverture<\/dt><dd>L'ouverture est le diamètre effectif du diaphragme de l'objectif qui laisse entrer la lumière. Elle s'exprime généralement par un nombre f, tel que f/2.8 ou f/5.6.<\/dd><\/div><div class=\"term\" data-s=\"vitesse d&#x27;obturation la vitesse d&#x27;obturation correspond à la durée pendant laquelle le capteur reçoit la lumière pour chaque image. elle influence la luminosité et le rendu du mouvement.\"><dt><span class=\"tn\">66<\/span>Vitesse d'obturation<\/dt><dd>La vitesse d'obturation correspond à la durée pendant laquelle le capteur reçoit la lumière pour chaque image. Elle influence la luminosité et le rendu du mouvement.<\/dd><\/div><div class=\"term\" data-s=\"iso la sensibilité iso représente un réglage du système de capture qui influence le niveau du signal enregistré. une valeur élevée peut aider en faible lumière, mais augmente souvent le bruit numérique.\"><dt><span class=\"tn\">67<\/span>ISO<\/dt><dd>La sensibilité ISO représente un réglage du système de capture qui influence le niveau du signal enregistré. Une valeur élevée peut aider en faible lumière, mais augmente souvent le bruit numérique.<\/dd><\/div><div class=\"term\" data-s=\"sous-exposition la sous-exposition est un état dans lequel l&#x27;image est trop sombre et où des détails peuvent être perdus dans les zones sombres.\"><dt><span class=\"tn\">68<\/span>Sous-exposition<\/dt><dd>La sous-exposition est un état dans lequel l'image est trop sombre et où des détails peuvent être perdus dans les zones sombres.<\/dd><\/div><div class=\"term\" data-s=\"surexposition la surexposition est un état dans lequel certaines parties de l&#x27;image sont trop lumineuses et peuvent perdre leurs détails.\"><dt><span class=\"tn\">69<\/span>Surexposition<\/dt><dd>La surexposition est un état dans lequel certaines parties de l'image sont trop lumineuses et peuvent perdre leurs détails.<\/dd><\/div><div class=\"term\" data-s=\"température de couleur la température de couleur décrit l&#x27;apparence chaude ou froide d&#x27;une lumière et s&#x27;exprime en kelvins (k).\"><dt><span class=\"tn\">70<\/span>Température de couleur<\/dt><dd>La température de couleur décrit l'apparence chaude ou froide d'une lumière et s'exprime en kelvins (K).<\/dd><\/div><div class=\"term\" data-s=\"éclairage à trois points l&#x27;éclairage à trois points est une méthode utilisant une lumière principale, une lumière de remplissage et une lumière de contre-jour pour modeler le sujet.\"><dt><span class=\"tn\">71<\/span>Éclairage à trois points<\/dt><dd>L'éclairage à trois points est une méthode utilisant une lumière principale, une lumière de remplissage et une lumière de contre-jour pour modeler le sujet.<\/dd><\/div><div class=\"term\" data-s=\"réflecteur un réflecteur est une surface qui renvoie la lumière vers le sujet afin d&#x27;éclaircir certaines zones sans nécessairement ajouter une nouvelle source lumineuse.\"><dt><span class=\"tn\">72<\/span>Réflecteur<\/dt><dd>Un réflecteur est une surface qui renvoie la lumière vers le sujet afin d'éclaircir certaines zones sans nécessairement ajouter une nouvelle source lumineuse.<\/dd><\/div><\/dl><\/section><section class=\"mod\" id=\"m6\"><h2>Module 6 — Prise de son et enregistrement vocal<\/h2><dl><div class=\"term\" data-s=\"son direct le son direct est le son enregistré au moment du tournage, en même temps que les images.\"><dt><span class=\"tn\">73<\/span>Son direct<\/dt><dd>Le son direct est le son enregistré au moment du tournage, en même temps que les images.<\/dd><\/div><div class=\"term\" data-s=\"voix off la voix off est une narration entendue dans la vidéo sans que la personne qui parle soit nécessairement visible à l&#x27;écran.\"><dt><span class=\"tn\">74<\/span>Voix off<\/dt><dd>La voix off est une narration entendue dans la vidéo sans que la personne qui parle soit nécessairement visible à l'écran.<\/dd><\/div><div class=\"term\" data-s=\"son d&#x27;ambiance le son d&#x27;ambiance est l&#x27;ensemble des sons qui caractérisent un environnement, comme les bruits d&#x27;une rue, d&#x27;une salle ou d&#x27;un marché.\"><dt><span class=\"tn\">75<\/span>Son d'ambiance<\/dt><dd>Le son d'ambiance est l'ensemble des sons qui caractérisent un environnement, comme les bruits d'une rue, d'une salle ou d'un marché.<\/dd><\/div><div class=\"term\" data-s=\"microphone un microphone est un appareil qui transforme les variations de pression acoustique en un signal électrique ou numérique exploitable par un système d&#x27;enregistrement.\"><dt><span class=\"tn\">76<\/span>Microphone<\/dt><dd>Un microphone est un appareil qui transforme les variations de pression acoustique en un signal électrique ou numérique exploitable par un système d'enregistrement.<\/dd><\/div><div class=\"term\" data-s=\"microphone-cravate le microphone-cravate est un petit microphone fixé aux vêtements, généralement près de la bouche, afin de capter la voix.\"><dt><span class=\"tn\">77<\/span>Microphone-cravate<\/dt><dd>Le microphone-cravate est un petit microphone fixé aux vêtements, généralement près de la bouche, afin de capter la voix.<\/dd><\/div><div class=\"term\" data-s=\"saturation sonore la saturation sonore se produit lorsque le signal dépasse les limites acceptées par le système d&#x27;enregistrement, provoquant une distorsion souvent désagréable.\"><dt><span class=\"tn\">78<\/span>Saturation sonore<\/dt><dd>La saturation sonore se produit lorsque le signal dépasse les limites acceptées par le système d'enregistrement, provoquant une distorsion souvent désagréable.<\/dd><\/div><div class=\"term\" data-s=\"bruit parasite un bruit parasite est un son indésirable qui perturbe l&#x27;écoute du message principal, par exemple le vent ou un ventilateur.\"><dt><span class=\"tn\">79<\/span>Bruit parasite<\/dt><dd>Un bruit parasite est un son indésirable qui perturbe l'écoute du message principal, par exemple le vent ou un ventilateur.<\/dd><\/div><div class=\"term\" data-s=\"synchronisation audio-vidéo la synchronisation audio-vidéo est la correspondance temporelle entre le son et les images, notamment entre les paroles et les mouvements des lèvres.\"><dt><span class=\"tn\">80<\/span>Synchronisation audio-vidéo<\/dt><dd>La synchronisation audio-vidéo est la correspondance temporelle entre le son et les images, notamment entre les paroles et les mouvements des lèvres.<\/dd><\/div><div class=\"term\" data-s=\"niveau sonore le niveau sonore représente l&#x27;intensité du signal audio enregistré ou reproduit. il doit être suffisamment élevé pour être audible sans provoquer de saturation.\"><dt><span class=\"tn\">81<\/span>Niveau sonore<\/dt><dd>Le niveau sonore représente l'intensité du signal audio enregistré ou reproduit. Il doit être suffisamment élevé pour être audible sans provoquer de saturation.<\/dd><\/div><div class=\"term\" data-s=\"fréquence sonore la fréquence sonore correspond au nombre de vibrations par seconde d&#x27;un son périodique. elle s&#x27;exprime en hertz (hz) et contribue à déterminer sa hauteur.\"><dt><span class=\"tn\">82<\/span>Fréquence sonore<\/dt><dd>La fréquence sonore correspond au nombre de vibrations par seconde d'un son périodique. Elle s'exprime en hertz (Hz) et contribue à déterminer sa hauteur.<\/dd><\/div><\/dl><\/section><section class=\"mod\" id=\"m7\"><h2>Module 7 — Préproduction et écriture audiovisuelle<\/h2><dl><div class=\"term\" data-s=\"sujet le sujet est le thème ou la réalité que la vidéo cherche à présenter, expliquer, documenter ou raconter.\"><dt><span class=\"tn\">83<\/span>Sujet<\/dt><dd>Le sujet est le thème ou la réalité que la vidéo cherche à présenter, expliquer, documenter ou raconter.<\/dd><\/div><div class=\"term\" data-s=\"public cible le public cible est le groupe de personnes auquel une vidéo est principalement destinée.\"><dt><span class=\"tn\">84<\/span>Public cible<\/dt><dd>Le public cible est le groupe de personnes auquel une vidéo est principalement destinée.<\/dd><\/div><div class=\"term\" data-s=\"objectif de communication l&#x27;objectif de communication est le résultat que le créateur souhaite obtenir auprès du public, par exemple informer, expliquer, sensibiliser ou divertir.\"><dt><span class=\"tn\">85<\/span>Objectif de communication<\/dt><dd>L'objectif de communication est le résultat que le créateur souhaite obtenir auprès du public, par exemple informer, expliquer, sensibiliser ou divertir.<\/dd><\/div><div class=\"term\" data-s=\"synopsis le synopsis est un résumé concis présentant l&#x27;idée principale, le sujet et le déroulement général d&#x27;une production audiovisuelle.\"><dt><span class=\"tn\">86<\/span>Synopsis<\/dt><dd>Le synopsis est un résumé concis présentant l'idée principale, le sujet et le déroulement général d'une production audiovisuelle.<\/dd><\/div><div class=\"term\" data-s=\"scénario le scénario est un document qui décrit le déroulement de l&#x27;histoire ou du contenu, les actions, les dialogues et les éléments nécessaires à sa réalisation.\"><dt><span class=\"tn\">87<\/span>Scénario<\/dt><dd>Le scénario est un document qui décrit le déroulement de l'histoire ou du contenu, les actions, les dialogues et les éléments nécessaires à sa réalisation.<\/dd><\/div><div class=\"term\" data-s=\"conducteur le conducteur est un document qui organise les différentes parties d&#x27;une vidéo selon leur ordre et, lorsque nécessaire, leur durée, leurs images et leurs sons.\"><dt><span class=\"tn\">88<\/span>Conducteur<\/dt><dd>Le conducteur est un document qui organise les différentes parties d'une vidéo selon leur ordre et, lorsque nécessaire, leur durée, leurs images et leurs sons.<\/dd><\/div><div class=\"term\" data-s=\"storyboard le storyboard est une représentation visuelle du déroulement d&#x27;une vidéo à l&#x27;aide de dessins ou d&#x27;images accompagnés d&#x27;indications sur les plans, les actions et parfois les mouvements de caméra.\"><dt><span class=\"tn\">89<\/span>Storyboard<\/dt><dd>Le storyboard est une représentation visuelle du déroulement d'une vidéo à l'aide de dessins ou d'images accompagnés d'indications sur les plans, les actions et parfois les mouvements de caméra.<\/dd><\/div><div class=\"term\" data-s=\"plan de tournage le plan de tournage est un document qui organise les prises de vue selon les lieux, les horaires, les personnes disponibles, les besoins matériels et les contraintes du projet.\"><dt><span class=\"tn\">90<\/span>Plan de tournage<\/dt><dd>Le plan de tournage est un document qui organise les prises de vue selon les lieux, les horaires, les personnes disponibles, les besoins matériels et les contraintes du projet.<\/dd><\/div><div class=\"term\" data-s=\"liste des plans la liste des plans est un document qui énumère les prises de vue nécessaires à la réalisation d&#x27;une vidéo.\"><dt><span class=\"tn\">91<\/span>Liste des plans<\/dt><dd>La liste des plans est un document qui énumère les prises de vue nécessaires à la réalisation d'une vidéo.<\/dd><\/div><div class=\"term\" data-s=\"repérage le repérage est la visite préalable d&#x27;un lieu pour vérifier les conditions de tournage, notamment la lumière, le son, l&#x27;espace et les autorisations nécessaires.\"><dt><span class=\"tn\">92<\/span>Repérage<\/dt><dd>Le repérage est la visite préalable d'un lieu pour vérifier les conditions de tournage, notamment la lumière, le son, l'espace et les autorisations nécessaires.<\/dd><\/div><div class=\"term\" data-s=\"budget de production le budget de production est l&#x27;estimation des dépenses nécessaires à la réalisation du projet : transport, accessoires, location de matériel, communication ou autres frais.\"><dt><span class=\"tn\">93<\/span>Budget de production<\/dt><dd>Le budget de production est l'estimation des dépenses nécessaires à la réalisation du projet : transport, accessoires, location de matériel, communication ou autres frais.<\/dd><\/div><\/dl><\/section><section class=\"mod\" id=\"m8\"><h2>Module 8 — Tournage, interview et reportage<\/h2><dl><div class=\"term\" data-s=\"tournage le tournage est la période pendant laquelle les images et les sons prévus sont enregistrés.\"><dt><span class=\"tn\">94<\/span>Tournage<\/dt><dd>Le tournage est la période pendant laquelle les images et les sons prévus sont enregistrés.<\/dd><\/div><div class=\"term\" data-s=\"interview une interview est un échange organisé au cours duquel une personne répond à des questions afin de transmettre des informations, des témoignages ou des opinions.\"><dt><span class=\"tn\">95<\/span>Interview<\/dt><dd>Une interview est un échange organisé au cours duquel une personne répond à des questions afin de transmettre des informations, des témoignages ou des opinions.<\/dd><\/div><div class=\"term\" data-s=\"reportage un reportage est une production qui présente un événement, une situation ou une réalité à partir d&#x27;observations, d&#x27;images, de témoignages et d&#x27;informations recueillies sur le terrain.\"><dt><span class=\"tn\">96<\/span>Reportage<\/dt><dd>Un reportage est une production qui présente un événement, une situation ou une réalité à partir d'observations, d'images, de témoignages et d'informations recueillies sur le terrain.<\/dd><\/div><div class=\"term\" data-s=\"question ouverte une question ouverte est une question qui invite l&#x27;interlocuteur à développer sa réponse plutôt qu&#x27;à répondre uniquement par oui ou non.\"><dt><span class=\"tn\">97<\/span>Question ouverte<\/dt><dd>Une question ouverte est une question qui invite l'interlocuteur à développer sa réponse plutôt qu'à répondre uniquement par oui ou non.<\/dd><\/div><div class=\"term\" data-s=\"image d&#x27;illustration une image d&#x27;illustration est une prise de vue qui complète le sujet principal et aide le spectateur à mieux comprendre ce qui est raconté.\"><dt><span class=\"tn\">98<\/span>Image d'illustration<\/dt><dd>Une image d'illustration est une prise de vue qui complète le sujet principal et aide le spectateur à mieux comprendre ce qui est raconté.<\/dd><\/div><div class=\"term\" data-s=\"prise une prise est un enregistrement particulier d&#x27;un plan. plusieurs prises peuvent être réalisées pour sélectionner la meilleure version au montage.\"><dt><span class=\"tn\">99<\/span>Prise<\/dt><dd>Une prise est un enregistrement particulier d'un plan. Plusieurs prises peuvent être réalisées pour sélectionner la meilleure version au montage.<\/dd><\/div><div class=\"term\" data-s=\"clap le clap est un dispositif ou un signal visuel et sonore qui permet notamment d&#x27;identifier une prise et de faciliter la synchronisation du son avec l&#x27;image.\"><dt><span class=\"tn\">100<\/span>Clap<\/dt><dd>Le clap est un dispositif ou un signal visuel et sonore qui permet notamment d'identifier une prise et de faciliter la synchronisation du son avec l'image.<\/dd><\/div><div class=\"term\" data-s=\"feuille de service la feuille de service est un document de tournage qui précise les horaires, les lieux, les personnes attendues et les informations pratiques nécessaires à l&#x27;équipe.\"><dt><span class=\"tn\">101<\/span>Feuille de service<\/dt><dd>La feuille de service est un document de tournage qui précise les horaires, les lieux, les personnes attendues et les informations pratiques nécessaires à l'équipe.<\/dd><\/div><\/dl><\/section><section class=\"mod\" id=\"m9\"><h2>Module 9 — Initiation au montage vidéo<\/h2><dl><div class=\"term\" data-s=\"montage vidéo le montage vidéo est le processus qui consiste à sélectionner, organiser et assembler les images et les sons pour construire une production cohérente.\"><dt><span class=\"tn\">102<\/span>Montage vidéo<\/dt><dd>Le montage vidéo est le processus qui consiste à sélectionner, organiser et assembler les images et les sons pour construire une production cohérente.<\/dd><\/div><div class=\"term\" data-s=\"logiciel de montage un logiciel de montage est une application qui permet d&#x27;importer des fichiers audiovisuels, de les organiser, de les modifier et d&#x27;exporter une vidéo.\"><dt><span class=\"tn\">103<\/span>Logiciel de montage<\/dt><dd>Un logiciel de montage est une application qui permet d'importer des fichiers audiovisuels, de les organiser, de les modifier et d'exporter une vidéo.<\/dd><\/div><div class=\"term\" data-s=\"timeline la timeline, ou ligne de temps, est l&#x27;espace de montage dans lequel les clips vidéo et audio sont disposés selon leur position temporelle.\"><dt><span class=\"tn\">104<\/span>Timeline<\/dt><dd>La timeline, ou ligne de temps, est l'espace de montage dans lequel les clips vidéo et audio sont disposés selon leur position temporelle.<\/dd><\/div><div class=\"term\" data-s=\"clip un clip est un élément audiovisuel importé ou utilisé dans un projet de montage. il peut correspondre à une partie d&#x27;une vidéo, à un fichier audio ou à une image.\"><dt><span class=\"tn\">105<\/span>Clip<\/dt><dd>Un clip est un élément audiovisuel importé ou utilisé dans un projet de montage. Il peut correspondre à une partie d'une vidéo, à un fichier audio ou à une image.<\/dd><\/div><div class=\"term\" data-s=\"découpage le découpage est l&#x27;opération qui consiste à diviser un clip en plusieurs parties pour supprimer des éléments inutiles ou réorganiser la séquence.\"><dt><span class=\"tn\">106<\/span>Découpage<\/dt><dd>Le découpage est l'opération qui consiste à diviser un clip en plusieurs parties pour supprimer des éléments inutiles ou réorganiser la séquence.<\/dd><\/div><div class=\"term\" data-s=\"coupe franche une coupe franche est un passage direct d&#x27;un plan à un autre, sans effet de transition visible.\"><dt><span class=\"tn\">107<\/span>Coupe franche<\/dt><dd>Une coupe franche est un passage direct d'un plan à un autre, sans effet de transition visible.<\/dd><\/div><div class=\"term\" data-s=\"transition une transition est un procédé visuel ou sonore qui permet de passer d&#x27;un plan à un autre. le fondu enchaîné et le fondu au noir en sont des exemples.\"><dt><span class=\"tn\">108<\/span>Transition<\/dt><dd>Une transition est un procédé visuel ou sonore qui permet de passer d'un plan à un autre. Le fondu enchaîné et le fondu au noir en sont des exemples.<\/dd><\/div><div class=\"term\" data-s=\"rythme du montage le rythme du montage est la cadence à laquelle les plans se succèdent et l&#x27;impression de rapidité ou de lenteur qui en résulte.\"><dt><span class=\"tn\">109<\/span>Rythme du montage<\/dt><dd>Le rythme du montage est la cadence à laquelle les plans se succèdent et l'impression de rapidité ou de lenteur qui en résulte.<\/dd><\/div><div class=\"term\" data-s=\"piste audio une piste audio est une voie de la timeline utilisée pour placer et organiser les éléments sonores, tels que la voix, la musique et les ambiances.\"><dt><span class=\"tn\">110<\/span>Piste audio<\/dt><dd>Une piste audio est une voie de la timeline utilisée pour placer et organiser les éléments sonores, tels que la voix, la musique et les ambiances.<\/dd><\/div><div class=\"term\" data-s=\"sous-titre un sous-titre est un texte affiché à l&#x27;écran qui retranscrit les paroles ou présente des informations utiles à la compréhension.\"><dt><span class=\"tn\">111<\/span>Sous-titre<\/dt><dd>Un sous-titre est un texte affiché à l'écran qui retranscrit les paroles ou présente des informations utiles à la compréhension.<\/dd><\/div><div class=\"term\" data-s=\"titre un titre est un texte ajouté à une vidéo pour présenter un sujet, identifier une personne ou introduire une partie du contenu.\"><dt><span class=\"tn\">112<\/span>Titre<\/dt><dd>Un titre est un texte ajouté à une vidéo pour présenter un sujet, identifier une personne ou introduire une partie du contenu.<\/dd><\/div><div class=\"term\" data-s=\"voix off au montage la voix off au montage est une narration enregistrée puis ajoutée à la vidéo afin d&#x27;expliquer les images ou de relier les différentes parties du récit.\"><dt><span class=\"tn\">113<\/span>Voix off au montage<\/dt><dd>La voix off au montage est une narration enregistrée puis ajoutée à la vidéo afin d'expliquer les images ou de relier les différentes parties du récit.<\/dd><\/div><div class=\"term\" data-s=\"correction colorimétrique la correction colorimétrique est l&#x27;ensemble des ajustements visant à équilibrer la luminosité, le contraste et les couleurs pour obtenir une image cohérente.\"><dt><span class=\"tn\">114<\/span>Correction colorimétrique<\/dt><dd>La correction colorimétrique est l'ensemble des ajustements visant à équilibrer la luminosité, le contraste et les couleurs pour obtenir une image cohérente.<\/dd><\/div><div class=\"term\" data-s=\"étalonnage l&#x27;étalonnage est le travail de traitement des couleurs qui permet d&#x27;harmoniser les plans et de créer une apparence visuelle intentionnelle.\"><dt><span class=\"tn\">115<\/span>Étalonnage<\/dt><dd>L'étalonnage est le travail de traitement des couleurs qui permet d'harmoniser les plans et de créer une apparence visuelle intentionnelle.<\/dd><\/div><div class=\"term\" data-s=\"projet de montage le projet de montage est le fichier qui conserve l&#x27;organisation des médias, les coupes, les effets et les paramètres de travail. il ne contient pas nécessairement les médias eux-mêmes.\"><dt><span class=\"tn\">116<\/span>Projet de montage<\/dt><dd>Le projet de montage est le fichier qui conserve l'organisation des médias, les coupes, les effets et les paramètres de travail. Il ne contient pas nécessairement les médias eux-mêmes.<\/dd><\/div><\/dl><\/section><section class=\"mod\" id=\"m10\"><h2>Module 10 — Habillage sonore et graphique<\/h2><dl><div class=\"term\" data-s=\"habillage sonore l&#x27;habillage sonore est l&#x27;organisation des voix, musiques, ambiances et effets sonores qui accompagnent une vidéo.\"><dt><span class=\"tn\">117<\/span>Habillage sonore<\/dt><dd>L'habillage sonore est l'organisation des voix, musiques, ambiances et effets sonores qui accompagnent une vidéo.<\/dd><\/div><div class=\"term\" data-s=\"bande sonore la bande sonore désigne l&#x27;ensemble des éléments audio associés à une production audiovisuelle.\"><dt><span class=\"tn\">118<\/span>Bande sonore<\/dt><dd>La bande sonore désigne l'ensemble des éléments audio associés à une production audiovisuelle.<\/dd><\/div><div class=\"term\" data-s=\"musique de fond la musique de fond est une musique utilisée pour accompagner une scène ou une narration sans détourner excessivement l&#x27;attention du contenu principal.\"><dt><span class=\"tn\">119<\/span>Musique de fond<\/dt><dd>La musique de fond est une musique utilisée pour accompagner une scène ou une narration sans détourner excessivement l'attention du contenu principal.<\/dd><\/div><div class=\"term\" data-s=\"fondu sonore un fondu sonore est une augmentation ou une diminution progressive du volume d&#x27;un son.\"><dt><span class=\"tn\">120<\/span>Fondu sonore<\/dt><dd>Un fondu sonore est une augmentation ou une diminution progressive du volume d'un son.<\/dd><\/div><div class=\"term\" data-s=\"effet sonore un effet sonore est un son utilisé pour illustrer une action, souligner une transition ou renforcer une ambiance.\"><dt><span class=\"tn\">121<\/span>Effet sonore<\/dt><dd>Un effet sonore est un son utilisé pour illustrer une action, souligner une transition ou renforcer une ambiance.<\/dd><\/div><div class=\"term\" data-s=\"habillage graphique l&#x27;habillage graphique regroupe les titres, les logos, les couleurs, les sous-titres et les autres éléments visuels ajoutés à la vidéo.\"><dt><span class=\"tn\">122<\/span>Habillage graphique<\/dt><dd>L'habillage graphique regroupe les titres, les logos, les couleurs, les sous-titres et les autres éléments visuels ajoutés à la vidéo.<\/dd><\/div><div class=\"term\" data-s=\"typographie la typographie est l&#x27;art de choisir et de présenter les caractères afin de rendre les textes lisibles et visuellement cohérents.\"><dt><span class=\"tn\">123<\/span>Typographie<\/dt><dd>La typographie est l'art de choisir et de présenter les caractères afin de rendre les textes lisibles et visuellement cohérents.<\/dd><\/div><div class=\"term\" data-s=\"identité visuelle l&#x27;identité visuelle est l&#x27;ensemble des éléments graphiques qui permettent de reconnaître une école, une entreprise, une association ou un projet.\"><dt><span class=\"tn\">124<\/span>Identité visuelle<\/dt><dd>L'identité visuelle est l'ensemble des éléments graphiques qui permettent de reconnaître une école, une entreprise, une association ou un projet.<\/dd><\/div><\/dl><\/section><section class=\"mod\" id=\"m11\"><h2>Module 11 — Exportation, diffusion et éthique<\/h2><dl><div class=\"term\" data-s=\"exportation l&#x27;exportation est l&#x27;opération par laquelle le logiciel de montage produit un fichier vidéo final à partir du projet.\"><dt><span class=\"tn\">125<\/span>Exportation<\/dt><dd>L'exportation est l'opération par laquelle le logiciel de montage produit un fichier vidéo final à partir du projet.<\/dd><\/div><div class=\"term\" data-s=\"conteneur vidéo un conteneur est un format de fichier qui regroupe des flux audiovisuels et parfois des métadonnées. mp4 et mov sont des exemples de conteneurs.\"><dt><span class=\"tn\">126<\/span>Conteneur vidéo<\/dt><dd>Un conteneur est un format de fichier qui regroupe des flux audiovisuels et parfois des métadonnées. MP4 et MOV sont des exemples de conteneurs.<\/dd><\/div><div class=\"term\" data-s=\"codec un codec est un procédé logiciel ou matériel permettant d&#x27;encoder et, généralement, de décoder des données audio ou vidéo. h.264 et h.265 sont des exemples de codecs vidéo.\"><dt><span class=\"tn\">127<\/span>Codec<\/dt><dd>Un codec est un procédé logiciel ou matériel permettant d'encoder et, généralement, de décoder des données audio ou vidéo. H.264 et H.265 sont des exemples de codecs vidéo.<\/dd><\/div><div class=\"term\" data-s=\"compression la compression consiste à réduire la taille d&#x27;un fichier. selon la méthode et les paramètres employés, elle peut entraîner une perte de qualité.\"><dt><span class=\"tn\">128<\/span>Compression<\/dt><dd>La compression consiste à réduire la taille d'un fichier. Selon la méthode et les paramètres employés, elle peut entraîner une perte de qualité.<\/dd><\/div><div class=\"term\" data-s=\"débit binaire le débit binaire correspond à la quantité de données traitées ou transmises chaque seconde. il influence la taille du fichier et, avec d&#x27;autres paramètres, sa qualité.\"><dt><span class=\"tn\">129<\/span>Débit binaire<\/dt><dd>Le débit binaire correspond à la quantité de données traitées ou transmises chaque seconde. Il influence la taille du fichier et, avec d'autres paramètres, sa qualité.<\/dd><\/div><div class=\"term\" data-s=\"format d&#x27;image le format d&#x27;image, ou rapport d&#x27;aspect, est le rapport entre la largeur et la hauteur de l&#x27;image, par exemple 16:9 ou 9:16.\"><dt><span class=\"tn\">130<\/span>Format d'image<\/dt><dd>Le format d'image, ou rapport d'aspect, est le rapport entre la largeur et la hauteur de l'image, par exemple 16:9 ou 9:16.<\/dd><\/div><div class=\"term\" data-s=\"diffusion vidéo la diffusion vidéo est la mise à disposition d&#x27;une production au public, par exemple sur un site web, une plateforme vidéo ou un réseau social.\"><dt><span class=\"tn\">131<\/span>Diffusion vidéo<\/dt><dd>La diffusion vidéo est la mise à disposition d'une production au public, par exemple sur un site web, une plateforme vidéo ou un réseau social.<\/dd><\/div><div class=\"term\" data-s=\"droit à l&#x27;image le droit à l&#x27;image désigne les règles applicables à la captation et à l&#x27;utilisation de l&#x27;image identifiable d&#x27;une personne. les conditions précises dépendent du droit applicable et du contexte.\"><dt><span class=\"tn\">132<\/span>Droit à l'image<\/dt><dd>Le droit à l'image désigne les règles applicables à la captation et à l'utilisation de l'image identifiable d'une personne. Les conditions précises dépendent du droit applicable et du contexte.<\/dd><\/div><div class=\"term\" data-s=\"droit d&#x27;auteur le droit d&#x27;auteur protège les créations originales selon la législation applicable. il concerne notamment les musiques, les vidéos, les photographies et les créations graphiques.\"><dt><span class=\"tn\">133<\/span>Droit d'auteur<\/dt><dd>Le droit d'auteur protège les créations originales selon la législation applicable. Il concerne notamment les musiques, les vidéos, les photographies et les créations graphiques.<\/dd><\/div><div class=\"term\" data-s=\"consentement le consentement est l&#x27;accord donné librement et de manière suffisamment éclairée par une personne pour une action déterminée, dans les limites prévues par le contexte et la loi.\"><dt><span class=\"tn\">134<\/span>Consentement<\/dt><dd>Le consentement est l'accord donné librement et de manière suffisamment éclairée par une personne pour une action déterminée, dans les limites prévues par le contexte et la loi.<\/dd><\/div><div class=\"term\" data-s=\"sauvegarde la sauvegarde est la création d&#x27;une copie de fichiers afin de réduire le risque de perte en cas de panne, d&#x27;erreur ou de suppression.\"><dt><span class=\"tn\">135<\/span>Sauvegarde<\/dt><dd>La sauvegarde est la création d'une copie de fichiers afin de réduire le risque de perte en cas de panne, d'erreur ou de suppression.<\/dd><\/div><div class=\"term\" data-s=\"archivage l&#x27;archivage consiste à conserver et à organiser des fichiers pour pouvoir les retrouver et les réutiliser ultérieurement.\"><dt><span class=\"tn\">136<\/span>Archivage<\/dt><dd>L'archivage consiste à conserver et à organiser des fichiers pour pouvoir les retrouver et les réutiliser ultérieurement.<\/dd><\/div><\/dl><\/section><section class=\"mod\" id=\"m12\"><h2>Module 12 — Projet final et évaluation<\/h2><dl><div class=\"term\" data-s=\"cahier des charges le cahier des charges est un document qui définit les objectifs, le public, les contraintes, les caractéristiques et les résultats attendus d&#x27;un projet vidéo.\"><dt><span class=\"tn\">137<\/span>Cahier des charges<\/dt><dd>Le cahier des charges est un document qui définit les objectifs, le public, les contraintes, les caractéristiques et les résultats attendus d'un projet vidéo.<\/dd><\/div><div class=\"term\" data-s=\"produit audiovisuel final le produit audiovisuel final est la version achevée et exportée d&#x27;une vidéo, prête à être présentée ou diffusée.\"><dt><span class=\"tn\">138<\/span>Produit audiovisuel final<\/dt><dd>Le produit audiovisuel final est la version achevée et exportée d'une vidéo, prête à être présentée ou diffusée.<\/dd><\/div><div class=\"term\" data-s=\"contrôle qualité le contrôle qualité est la vérification du bon fonctionnement et de la conformité du produit final : image, son, titres, montage, format et lecture.\"><dt><span class=\"tn\">139<\/span>Contrôle qualité<\/dt><dd>Le contrôle qualité est la vérification du bon fonctionnement et de la conformité du produit final : image, son, titres, montage, format et lecture.<\/dd><\/div><div class=\"term\" data-s=\"autoévaluation l&#x27;autoévaluation est une démarche par laquelle l&#x27;apprenant analyse ses propres réalisations, identifie ses réussites et détermine les compétences qu&#x27;il doit encore améliorer.\"><dt><span class=\"tn\">140<\/span>Autoévaluation<\/dt><dd>L'autoévaluation est une démarche par laquelle l'apprenant analyse ses propres réalisations, identifie ses réussites et détermine les compétences qu'il doit encore améliorer.<\/dd><\/div><div class=\"term\" data-s=\"portfolio audiovisuel un portfolio audiovisuel est une collection organisée de réalisations permettant de présenter les compétences, l&#x27;expérience et le style d&#x27;un créateur.\"><dt><span class=\"tn\">141<\/span>Portfolio audiovisuel<\/dt><dd>Un portfolio audiovisuel est une collection organisée de réalisations permettant de présenter les compétences, l'expérience et le style d'un créateur.<\/dd><\/div><div class=\"term\" data-s=\"attestation de formation une attestation de formation est un document délivré par l&#x27;organisme concerné pour confirmer la participation ou l&#x27;accomplissement d&#x27;une formation, selon ses critères.\"><dt><span class=\"tn\">142<\/span>Attestation de formation<\/dt><dd>Une attestation de formation est un document délivré par l'organisme concerné pour confirmer la participation ou l'accomplissement d'une formation, selon ses critères.<\/dd><\/div><\/dl><\/section>\n<section class=\"mod\" id=\"glossaire\"><h2>XIII. Petit glossaire complémentaire<\/h2>\n<p>Quelques termes supplémentaires qui peuvent apparaître dans les exercices et les tutoriels.<\/p><div class=\"tw\"><table class=\"\"><thead><tr><th>Terme<\/th><th>Définition<\/th><\/tr><\/thead><tbody><tr><td><b>B-roll<\/b><\/td><td>Images complémentaires utilisées pour illustrer un sujet ou couvrir des coupes dans une interview.<\/td><\/tr><tr><td><b>A-roll<\/b><\/td><td>Séquence principale d'une production, par exemple l'interview centrale ou la narration principale.<\/td><\/tr><tr><td><b>Ratio d'aspect<\/b><\/td><td>Rapport entre la largeur et la hauteur d'une image.<\/td><\/tr><tr><td><b>Métadonnées<\/b><\/td><td>Informations associées à un fichier, comme la date, la durée, la résolution ou les paramètres de capture.<\/td><\/tr><tr><td><b>Cadence de lecture<\/b><\/td><td>Vitesse à laquelle les images sont affichées.<\/td><\/tr><tr><td><b>Ralenti<\/b><\/td><td>Effet obtenu lorsqu'un mouvement paraît plus lent à la lecture.<\/td><\/tr><tr><td><b>Accéléré<\/b><\/td><td>Effet obtenu lorsqu'un mouvement paraît plus rapide à la lecture.<\/td><\/tr><tr><td><b>Bruit numérique<\/b><\/td><td>Variations indésirables visibles dans l'image, notamment en faible lumière.<\/td><\/tr><tr><td><b>LUT<\/b><\/td><td>Table de correspondance utilisée pour transformer ou prévisualiser des couleurs dans un flux de travail audiovisuel.<\/td><\/tr><tr><td><b>Streaming<\/b><\/td><td>Diffusion de contenus audio ou vidéo par un réseau, généralement avec lecture pendant la réception des données.<\/td><\/tr><\/tbody><\/table><\/div><\/section>\n<p id=\"dict-none\" class=\"note\" hidden>Aucun terme ne correspond à cette recherche.<\/p>\n<script>\n(function(){\n  var q=document.getElementById('dict-q'),n=document.getElementById('dict-n'),none=document.getElementById('dict-none');\n  var terms=[].slice.call(document.querySelectorAll('.term')),mods=[].slice.call(document.querySelectorAll('.mod'));\n  function f(){\n    var v=q.value.trim().toLowerCase(),c=0;\n    terms.forEach(function(t){var ok=!v||t.dataset.s.indexOf(v)>-1;t.hidden=!ok;if(ok)c++;});\n    mods.forEach(function(m){\n      if(m.id==='glossaire'){m.hidden=!!v;return;}\n      m.hidden=!m.querySelector('.term:not([hidden])');\n    });\n    n.textContent=c+(c>1?' termes affichés':' terme affiché');\n    none.hidden=c>0||!v;\n  }\n  q.addEventListener('input',f);\n})();\n<\/script>\n\n    <div class=\"pager\"><a href=\"seances-9-12.html\">← Séances 9 à 12<\/a><a href=\"quiz.html\">Quiz
